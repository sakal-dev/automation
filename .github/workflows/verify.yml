# =============================================================================
# verify.yml — the SakalMaster citation verifier in CI (INTEGRATED mode). REAL.
# Contract: docs/task-contract.md step 4, sakalmaster mode — the SECOND judge.
# After merge, sakal-verify resolves the linked app's citations against the
# real tree; a merge that moved/renamed a cited symbol breaks a verified claim
# and this job goes red. AC status is DERIVED from citations — nothing an
# executor asserts can set it (invariant 3).
#
# The sakal-verify CLI is not published to npm (deliberate — see SakalMaster
# docs/ci/agent-runs.md), so this workflow checks out the SakalMaster repo and
# builds the CLI, then runs it against the CALLER's checkout. The SakalMaster
# checkout needs a read token (cross-repo private checkout — the built-in
# GITHUB_TOKEN cannot do it): secret SAKALMASTER_READ_TOKEN.
#
# How a repo calls it (trigger lives in the caller):
#   name: sakal-verify
#   on:
#     push: { branches: [main] }
#   permissions:
#     contents: read
#   jobs:
#     verify:
#       uses: sakal-dev/automation/.github/workflows/verify.yml@v2
#       with: { app: garage }
#       secrets: inherit
#
# Required caller secrets (see SakalMaster docs/ci/sakal-verify.yml):
#   SAKAL_TOKEN · SAKAL_SUPABASE_URL · SAKAL_SUPABASE_PUBLISHABLE_KEY ·
#   SAKAL_PROJECT · SAKALMASTER_READ_TOKEN
# =============================================================================
name: verify

on:
  workflow_call:
    inputs:
      app:
        description: The SakalMaster app key linked to this repo (e.g. garage)
        type: string
        required: true
      sakalmaster_repo:
        description: Where the SakalMaster monorepo (and its CLI) lives
        type: string
        default: sakal-dev/sakalmaster
      sakalmaster_ref:
        description: Ref of the SakalMaster repo to build the CLI from
        type: string
        default: main
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout this repo (the tree citations resolve against)
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Checkout SakalMaster (the CLI source)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sakalmaster_repo }}
          ref: ${{ inputs.sakalmaster_ref }}
          token: ${{ secrets.SAKALMASTER_READ_TOKEN }}
          path: sakalmaster

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sakalmaster/pnpm-lock.yaml

      - name: Build the sakal-verify CLI
        working-directory: sakalmaster
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sakalmaster/cli build

      - name: Verify citations
        run: node sakalmaster/apps/cli/dist/verify.js "$GITHUB_WORKSPACE/workspace"
        env:
          SAKAL_SUPABASE_URL: ${{ secrets.SAKAL_SUPABASE_URL }}
          SAKAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SAKAL_SUPABASE_PUBLISHABLE_KEY }}
          SAKAL_TOKEN: ${{ secrets.SAKAL_TOKEN }}
          SAKAL_PROJECT: ${{ secrets.SAKAL_PROJECT }}
          SAKAL_APP: ${{ inputs.app }}
