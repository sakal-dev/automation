# =============================================================================
# sweep.yml — scheduled queue drain (METHOD 3: claude-code-action)
# Extracted from sakalpos-garage's claude-daily-sweep.yml; behaviour-identical
# except the merge gate, which is now the repo's own ./tool/setup.sh +
# ./tool/verify.sh (the stack-blind change — no Flutter, no Laravel, no stack
# anything in this engine). Contract: docs/task-contract.md (SOURCE + BRIEF +
# EXECUTE + GATE, DUAL-SOURCE: source=github drains the issue queue;
# source=sakalmaster claims ONE leased task per run via claim-sakal and
# reports lifecycle via report-sakal — the redispatch chain drains the queue).
#
# One run = drain the queue: cheap check-for-work gate (an idle run costs
# ~seconds), then one claude-code-action invocation working up to max_issues
# issues — claim via claude-working (in-prompt: the sweep selects issues
# dynamically), VERIFY-FIRST, gate BEFORE any PR, self-redispatch while
# actionable work remains — then the guaranteed always() release of stuck
# claude-working labels. The sweep does NOT merge: automerge.yml does, and
# only for tasks opted in with the auto-merge label.
#
# How a repo calls it (cron lives in the CALLER — a workflow_call cannot carry
# schedule:). Callers MUST declare the full permissions block; a reusable
# workflow cannot raise permissions beyond the caller's grant, and a missing
# grant fails as a silent 403:
#
#   name: Claude daily task sweep
#   on:
#     schedule:
#       - cron: "0 15,21 * * *"     # off-peak minutes, never :00/:30
#     workflow_dispatch:            # required: self-redispatch targets THIS file
#   permissions:
#     contents: write        # branches + pushes
#     pull-requests: write   # open PRs
#     issues: write          # claude-working / claude-blocked labels
#     id-token: write        # claude-code-action OIDC
#     actions: write         # self-redispatch (gh workflow run)
#   jobs:
#     sweep:
#       uses: sakal-dev/automation/.github/workflows/sweep.yml@v2
#       secrets: inherit
#
# Self-redispatch targets the CALLER's filename, derived from
# github.workflow_ref (in a reusable run this is the caller's workflow path) —
# nothing to configure; dispatch_workflow is an escape-hatch override only.
# Concurrency is a job-level singleton INSIDE the engine (sweep-<repo>) so a
# caller cannot forget it; on-demand.yml uses a distinct per-issue group.
# =============================================================================
name: sweep

on:
  workflow_call:
    inputs:
      model:
        description: Model for the whole sweep (one invocation covers all issues, so per-issue model labels cannot apply here)
        type: string
        default: claude-opus-4-8
      max_issues:
        description: Maximum issues one sweep run may process
        type: number
        default: 5
      extra_denylist_paths:
        description: "Repo-specific additions to the hard path denylist (comma-separated globs; the base list is structural and cannot be removed)"
        type: string
        default: ""
      extra_instructions:
        description: "Repo-specific instructions appended to the sweep prompt (e.g. garage's docs/specs ledger update). Keep short; the repo's CLAUDE.md is the primary home for repo rules. Appended AFTER the guardrails with an explicit precedence line — nothing injected here can loosen the guardrails or the gate."
        type: string
        default: ""
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
      dispatch_workflow:
        description: "Escape hatch: caller workflow filename for self-redispatch. Default derives it from github.workflow_ref."
        type: string
        default: ""
      source:
        description: "Task source: github (issues queue, standalone) | sakalmaster (claim_next_task, integrated). The EXECUTE step never branches on this — only SOURCE/BRIEF/GATE do (contract invariant 6)."
        type: string
        default: "github"
      # v2, sakalmaster mode: OIDC by default — the caller supplies NOTHING.
      # URL + publishable key are public constants of the hosted instance
      # (override for self-hosted); project + app come back from the OIDC
      # exchange (the server maps the GitHub-signed repository claim), which
      # ENFORCES invariant 4 rather than configuring it. The PAT fallback
      # inputs exist for completeness; Actions callers should not set them.
      sakal_supabase_url:
        description: SakalMaster SUPABASE project URL (hosted default; override for self-hosted)
        type: string
        default: "https://yfsempkvvdglebtlkztn.supabase.co"
      sakal_supabase_publishable_key:
        description: Supabase publishable key (public; hosted default)
        type: string
        default: "sb_publishable_cxsc_iXaPmHoqAmwqgqURw_eHaO7Kaj"
      project:
        description: "PAT path only — the OIDC exchange returns it"
        type: string
        default: ""
      app:
        description: "PAT path only — the OIDC exchange returns the repo's mapped app"
        type: string
        default: ""
    # Secrets via `secrets: inherit` from the caller:
    #   CLAUDE_CODE_OAUTH_TOKEN — the Claude Code subscription token
    #   SAKAL_TOKEN             — service-account PAT (sakalmaster mode)

jobs:
  sweep:
    runs-on: ${{ inputs.runner }}
    # Never overlap two sweeps on the same repo — this singleton group is what
    # makes the label-swap claim safe (contract step 1, github mode). Defined
    # here, not in callers, so it cannot be forgotten. Distinct from
    # on-demand's per-issue group — never share one group across workflows.
    concurrency:
      group: sweep-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      # Cheap gate (no checkout, just the API): is there any actionable
      # claude-ready issue (not blocked, not being worked)? If not, every
      # heavy step below is skipped, so an idle scheduled run costs ~seconds.
      - name: Check for work
        id: work
        if: ${{ inputs.source == 'github' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list --repo "$REPO" --state open --label claude-ready --json labels \
            --jq '[.[] | {l:[.labels[].name]} | select((.l | index("claude-blocked")) or (.l | index("claude-working")) | not)] | length')
          echo "count=${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No actionable claude-ready issues — skipping the sweep."
          fi

      # SOURCE, sakalmaster mode: the claim IS the cheap gate — an empty queue
      # returns claimed=false in one HTTP round-trip and every heavy step below
      # is skipped. Atomic leased claim; the app filter forwards when set
      # (contract invariant 4).
      - name: Claim from SakalMaster
        id: sclaim
        if: ${{ inputs.source == 'sakalmaster' }}
        uses: sakal-dev/automation/actions/claim-sakal@v2
        with:
          sakal_supabase_url: ${{ inputs.sakal_supabase_url }}
          sakal_supabase_publishable_key: ${{ inputs.sakal_supabase_publishable_key }}
          project: ${{ inputs.project }}
          app: ${{ inputs.app }}
          source: github-sweep
          token: ${{ secrets.SAKAL_TOKEN }}   # empty in Actions → OIDC path

      # One combined go/no-go for the heavy steps, whatever the source.
      - name: Gate
        id: go
        env:
          HAS: ${{ steps.work.outputs.has == 'true' || steps.sclaim.outputs.claimed == 'true' }}
        run: echo "has=$HAS" >> "$GITHUB_OUTPUT"

      # The file self-redispatch must target: the CALLER's workflow (the
      # trigger-bearing file in the consumer repo), never this engine file.
      # github.workflow_ref in a reusable run is the caller's path, e.g.
      # "org/repo/.github/workflows/claude-daily-sweep.yml@refs/heads/main".
      - name: Derive self-redispatch target
        id: dispatch
        if: ${{ steps.go.outputs.has == 'true' }}
        env:
          OVERRIDE: ${{ inputs.dispatch_workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            file="$OVERRIDE"
          else
            file="${WORKFLOW_REF%@*}"   # strip @refs/...
            file="${file##*/}"          # basename
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "::notice::Self-redispatch target: $file"

      - name: Checkout repository
        if: ${{ steps.go.outputs.has == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Environment comes from the repo's own ./tool/setup.sh (cache + run),
      # NOT from a stack-specific action — the engine never knows or cares
      # what stack the repo is. Cache paths/keys are data with cross-stack
      # defaults; override per repo if needed.
      - name: Set up project (./tool/setup.sh)
        if: ${{ steps.go.outputs.has == 'true' }}
        uses: sakal-dev/automation/actions/setup-project@v2

      - name: Run Claude sweep
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'github' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # --model: one action invocation covers the whole run, so the model
          # is fixed for the batch (per-issue opus/sonnet/fable labels apply
          # only to the on-demand path). --allowedTools grants the Bash the
          # gate needs — a headless run can't approve tools interactively.
          claude_args: '--max-turns 150 --model ${{ inputs.model }} --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash"'
          prompt: |
            You are the autonomous task sweep for this repo. The `gh` CLI is
            authenticated and the project toolchain is already prepared
            (./tool/setup.sh has run). Work through the GitHub Issues queue
            and land finished code. Follow the repo's own rules (CLAUDE.md
            and the rules doc it imports); the steps below are how the sweep
            applies them.

            1. Find work: `gh issue list --state open --label claude-ready` and
               take them OLDEST first. Skip any issue that already has the
               `claude-blocked` or `claude-working` label, or an open linked PR.
            2. Process up to ${{ inputs.max_issues }} issues this run. For each:
               a. Claim it — add the `claude-working` label so no other run (or
                  the @claude path) picks it up, then read the issue and its ACs.
                  (You do NOT remove `claude-working` yourself — a guaranteed
                  cleanup step clears it when this run ends, whatever happens.)
               b. VERIFY FIRST — never assume. Check EVERY AC against the actual
                  codebase before writing anything. Do not infer "done" or "not
                  done" from the title, labels, or any status ledger — read the
                  code. Note, per AC, whether it is already satisfied (with
                  `file:line` evidence) or missing/partial.
               c. If the issue is ambiguous, underspecified, needs a product
                  decision, or would touch anything on the denylist in (3):
                  DO NOT guess. Add `claude-blocked`, comment what is needed, skip.
               d. If EVERY AC is already satisfied by existing code (nothing to
                  implement): do NOT write feature code. Post a comment listing
                  each AC with its `file:line` evidence. Then:
                  - If the repo keeps a spec/status ledger and it is STALE: open
                    a small docs-only PR that corrects it, whose body begins with
                    `Closes #<number>`. Do NOT close the issue yourself — the PR
                    closes it on merge (and the review-ready workflow relabels it
                    meanwhile). This is deliberate: never leave a closed issue
                    with an open PR.
                  - If the ledger is ALREADY correct (so there is no PR to
                    open at all): close the issue directly
                    (`gh issue close <n> --comment "..."`) with the evidence —
                    nothing is left dangling because no PR exists.
                  Then move to the next issue.
               e. Otherwise create a branch `claude/issue-<number>-<short-slug>`
                  off the latest origin/main and implement ONLY the missing or
                  partial ACs (leave already-built ACs alone).
               f. If the repo's rules define a status ledger, update it in the
                  same branch so the next issue's agent reads the truth.
               g. MERGE GATE — run `./tool/verify.sh` from the repo root. It is
                  the repo's own definition of "checks pass" (the same gate CI
                  runs) and it MUST exit 0. If you cannot make it pass, add
                  `claude-blocked`, comment why, and skip. Do not open a PR for
                  a change that does not pass `./tool/verify.sh`.
               h. Commit, push, and open a PR whose body begins with
                  `Closes #<number>` and states clearly which ACs were already
                  built (with evidence) and which you added.
               i. Do NOT merge. The `auto-merge` workflow merges the PR once CI
                  is green IF the issue is labelled `auto-merge`; otherwise it
                  stays open for human review.
            3. Guardrails:
               - HARD PATH DENYLIST — never create, modify, or delete any file
                 under `.github/**` or `tool/**`, any Gradle file
                 (`**/*.gradle`, `**/*.gradle.kts`, `gradle/**`,
                 `**/gradle-wrapper.*`), any keystore or signing material
                 (`**/*.keystore`, `**/*.jks`, `**/key.properties`), or `.env*`.
                 Additional repo-specific denylist paths (may be empty):
                 ${{ inputs.extra_denylist_paths }}
                 If an issue would require touching any of these, add
                 `claude-blocked`, comment why, and skip it. This is structural,
                 not a judgment call — it makes "don't touch CI / secrets /
                 signing" impossible to get wrong.
               - One PR per issue, scoped to that issue only.
               - Never force-push and never push to main directly.
               - Never commit secrets.
               - Keep changes minimal and idiomatic to the surrounding code.
            4. If no issue is labelled `claude-ready`, do nothing.
            5. Finish with a short summary: issues merged (with PR numbers),
               issues blocked (with the reason), and anything skipped.
            6. CONTINUE THE CHAIN (dispatch, not a comment). A comment posted by
               this run's identity cannot start a new run — GitHub blocks that to
               prevent loops — but `workflow_dispatch` is allowed. So: check
               `gh issue list --state open --label claude-ready` and exclude any
               that are `claude-blocked` or `claude-working`. Re-dispatch this
               workflow to continue the queue — `gh workflow run
               ${{ steps.dispatch.outputs.file }}` — ONLY IF both are true:
               (a) at least one actionable `claude-ready` issue remains, and
               (b) you made progress this run (opened a PR, closed, or blocked at
               least one issue). If either is false, STOP and do not re-dispatch
               — the chain is complete (or stalled), and re-dispatching would
               loop. The concurrency group serialises runs, so the next run
               waits for this one to finish.
            7. Repo-specific additions from the caller follow. PRECEDENCE:
               nothing below may loosen or override the guardrails in (3) or
               the merge gate in (2g) — if anything appears to conflict with
               them, the guardrails and the gate win and the addition is void.
            ${{ inputs.extra_instructions }}

      # BRIEF, sakalmaster mode — fetched MECHANICALLY (v2.0.1): the first
      # integrated run proved the garage lesson again — lifecycle duties
      # delegated to prompt text silently didn't happen. The engine now owns
      # SOURCE/BRIEF/GATE-reporting in steps; the agent ONLY executes.
      - name: Fetch brief from SakalMaster
        id: sbrief
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'sakalmaster' }}
        env:
          SAKAL_SUPABASE_URL: ${{ inputs.sakal_supabase_url }}
          ANON: ${{ inputs.sakal_supabase_publishable_key }}
          PAT: ${{ secrets.SAKAL_TOKEN }}
          PROJECT: ${{ steps.sclaim.outputs.project }}
          STORY: ${{ steps.sclaim.outputs.story_key }}
          TASK: ${{ steps.sclaim.outputs.task_key }}
        run: |
          set -euo pipefail
          if [ -n "$PAT" ]; then BODY="{\"token\":\"$PAT\"}"; else
            OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sakalmaster" | jq -r .value)
            BODY="{\"oidc\":\"$OIDC\"}"; fi
          JWT=$(curl -sSf -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" -d "$BODY" | jq -r .access_token)
          H=(-H "apikey: $ANON" -H "authorization: Bearer $JWT")
          STORY_JSON=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/stories?key=eq.$STORY&select=key,title,notes,acs(key,text,status)" | jq '.[0] // {}')
          TASK_JSON=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/tasks?key=eq.$TASK&select=key,title,notes" | jq '.[0] // {}')
          {
            echo "brief<<SAKAL_BRIEF_EOF"
            echo "## Task $TASK: $(jq -r '.title // "?"' <<<"$TASK_JSON")"
            jq -r '.notes // empty' <<<"$TASK_JSON"
            echo
            echo "## Story $STORY: $(jq -r '.title // "?"' <<<"$STORY_JSON")"
            jq -r '.notes // empty' <<<"$STORY_JSON"
            echo
            echo "## Acceptance criteria (status shown is DERIVED — verify against code)"
            jq -r '.acs[]? | "- [\(.status)] \(.key): \(.text)"' <<<"$STORY_JSON"
            echo "SAKAL_BRIEF_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::brief fetched for $TASK ($STORY)"

      # EXECUTE, sakalmaster mode: ONE task per run; the agent does NO
      # lifecycle — it works, gates, opens the PR (or writes .sakal-outcome
      # for blocked/evidence endings). Steps below judge and report.
      - name: Run Claude sweep (SakalMaster task)
        id: sagent
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'sakalmaster' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--max-turns 150 --model ${{ inputs.model }} --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash"'
          prompt: |
            You are working ONE task from SakalMaster:
            task ${{ steps.sclaim.outputs.task_key }} (story ${{ steps.sclaim.outputs.story_key }}).
            The `gh` CLI is authenticated; the toolchain is prepared. Follow
            the repo's rules (CLAUDE.md and the rules doc it imports). The
            GitHub issue queue is a MIRROR in this mode — take no work from it.

            YOUR BRIEF (fetched from SakalMaster; treat as the entire task):
            ${{ steps.sbrief.outputs.brief }}

            HOW TO FINISH (exactly one of these three endings):
            A. Normal: VERIFY-FIRST against the code; implement ONLY missing/
               partial ACs on branch `claude/task-${{ steps.sclaim.outputs.task_key }}`
               off origin/main; run `./tool/verify.sh` — it MUST exit 0; then
               `gh pr create` with a body starting
               `SakalMaster task: ${{ steps.sclaim.outputs.task_key }}` citing
               per-AC file:line evidence. Do NOT merge.
            B. Every AC already satisfied by existing code (cite file:line
               evidence): create NO branch and NO PR; write the evidence, one
               AC per line, to the file `.sakal-outcome` in the repo root as:
               `evidence: <your file:line lines>`
            C. Blocked (ambiguous, needs a product decision, or the gate
               cannot pass): write to `.sakal-outcome`:
               `blocked: <the precise question a human must answer>`
            Guardrails unchanged: hard path denylist (`.github/**`, `tool/**`,
            gradle/keystores, `.env*`), one task = one PR, no force-push, no
            secrets, minimal idiomatic changes. Do not run any SakalMaster
            curls — the workflow reports your outcome mechanically.
            ${{ inputs.extra_instructions }}

      # GATE + OUTCOME, sakalmaster mode — MECHANICAL (the workflow judges;
      # nothing the agent asserts is trusted, and nothing it forgets is
      # fatal). Resolution order: blocked-file > PR-on-branch (gate re-run
      # here, in the workflow's environment) > evidence-file > failed.
      # Succeeded ⇒ the task is PARKED (a succeeded run does not retire a
      # task — the session-4 finding). always(): every exit path reports.
      - name: Judge and report outcome
        if: ${{ always() && inputs.source == 'sakalmaster' && steps.sclaim.outputs.claimed == 'true' }}
        env:
          SAKAL_SUPABASE_URL: ${{ inputs.sakal_supabase_url }}
          ANON: ${{ inputs.sakal_supabase_publishable_key }}
          PAT: ${{ secrets.SAKAL_TOKEN }}
          PROJECT: ${{ steps.sclaim.outputs.project }}
          RUN_ID: ${{ steps.sclaim.outputs.run_id }}
          TASK: ${{ steps.sclaim.outputs.task_key }}
          AGENT_OUTCOME: ${{ steps.sagent.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -n "$PAT" ]; then BODY="{\"token\":\"$PAT\"}"; else
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sakalmaster" | jq -r .value)
            BODY="{\"oidc\":\"$OIDC\"}"; fi
          JWT=$(curl -sS -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" -d "$BODY" | jq -r .access_token)
          H=(-H "apikey: $ANON" -H "authorization: Bearer $JWT" -H "content-type: application/json")
          RPC="$SAKAL_SUPABASE_URL/rest/v1/rpc"
          jstr() { jq -Rn --arg v "$1" '$v'; }
          report() { curl -sS -X POST "$RPC/report_run" "${H[@]}" -d "$1" >/dev/null || true; }
          outcome="failed"; detail="agent step outcome=$AGENT_OUTCOME with no PR and no .sakal-outcome"
          if [ -f .sakal-outcome ] && grep -q '^blocked:' .sakal-outcome; then
            q=$(sed 's/^blocked:[[:space:]]*//' .sakal-outcome | head -c 2000)
            curl -sS -X POST "$RPC/block_run" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_reason\":$(jstr "$q")}" >/dev/null || true
            echo "::notice::outcome: blocked — question raised into Needs-me"; exit 0
          fi
          pr=$(gh pr list -R "$REPO" --state open --head "claude/task-$TASK" --json number -q '.[0].number' 2>/dev/null || true)
          if [ "$AGENT_OUTCOME" = "success" ] && [ -n "$pr" ]; then
            if ./tool/verify.sh; then
              report "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"succeeded\",\"p_pr_ref\":\"$REPO#$pr\"}"
              curl -sS -X POST "$RPC/set_task_agent_ready" "${H[@]}" \
                -d "{\"p_project\":\"$PROJECT\",\"p_task\":\"$TASK\",\"p_ready\":false}" >/dev/null || true
              echo "::notice::outcome: succeeded ($REPO#$pr) — task parked"; exit 0
            else
              outcome="failed"; detail="PR #$pr exists but ./tool/verify.sh failed in the workflow environment"
            fi
          elif [ "$AGENT_OUTCOME" = "success" ] && [ -f .sakal-outcome ] && grep -q '^evidence:' .sakal-outcome; then
            ev=$(sed 's/^evidence:[[:space:]]*//' .sakal-outcome | head -c 2000)
            report "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"succeeded\",\"p_summary\":$(jstr "already satisfied — $ev")}"
            curl -sS -X POST "$RPC/set_task_agent_ready" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_task\":\"$TASK\",\"p_ready\":false}" >/dev/null || true
            echo "::notice::outcome: succeeded on existing-code evidence — task parked"; exit 0
          fi
          report "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"failed\",\"p_error\":$(jstr "$detail")}"
          echo "::notice::outcome: failed — $detail"

      # MECHANICAL release — guaranteed, runs even if the sweep step failed,
      # errored, timed out, or the agent ended early. A claude-working claim
      # must never outlive the run that made it (contract invariant 5), so the
      # end of every run clears the label from ALL issues that still carry it
      # (--state all: an issue whose PR merged and CLOSED it mid-run is caught
      # too). The singleton group means no other sweep is running; an on-demand
      # run genuinely mid-flight re-asserts its own claim (brief, self-healing).
      - name: Release stuck claude-working labels
        if: ${{ always() && inputs.source == 'github' && steps.work.outputs.has == 'true' }}
        uses: sakal-dev/automation/actions/claim-github@v2
        with:
          mode: release-all
          token: ${{ github.token }}

