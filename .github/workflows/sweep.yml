# =============================================================================
# sweep.yml — scheduled queue drain (METHOD 3: claude-code-action)
# Extracted from sakalpos-garage's claude-daily-sweep.yml; behaviour-identical
# except the merge gate, which is now the repo's own ./tool/setup.sh +
# ./tool/verify.sh (the stack-blind change — no Flutter, no Laravel, no stack
# anything in this engine). Contract: docs/task-contract.md (SOURCE + BRIEF +
# EXECUTE + GATE, DUAL-SOURCE: source=github drains the issue queue;
# source=sakalmaster claims ONE leased task per run via claim-sakal and
# reports lifecycle via report-sakal — the redispatch chain drains the queue).
#
# One run = drain the queue: cheap check-for-work gate (an idle run costs
# ~seconds), then one claude-code-action invocation working up to max_issues
# issues — claim via claude-working (in-prompt: the sweep selects issues
# dynamically), VERIFY-FIRST, gate BEFORE any PR, self-redispatch while
# actionable work remains — then the guaranteed always() release of stuck
# claude-working labels. The sweep does NOT merge: automerge.yml does, and
# only for tasks opted in with the auto-merge label.
#
# How a repo calls it (cron lives in the CALLER — a workflow_call cannot carry
# schedule:). Callers MUST declare the full permissions block; a reusable
# workflow cannot raise permissions beyond the caller's grant, and a missing
# grant fails as a silent 403:
#
#   name: Claude daily task sweep
#   on:
#     schedule:
#       - cron: "0 15,21 * * *"     # off-peak minutes, never :00/:30
#     workflow_dispatch:            # required: self-redispatch targets THIS file
#   permissions:
#     contents: write        # branches + pushes
#     pull-requests: write   # open PRs
#     issues: write          # claude-working / claude-blocked labels
#     id-token: write        # claude-code-action OIDC
#     actions: write         # self-redispatch (gh workflow run)
#   jobs:
#     sweep:
#       uses: sakal-dev/automation/.github/workflows/sweep.yml@v2
#       secrets: inherit
#
# Self-redispatch targets the CALLER's filename, derived from
# github.workflow_ref (in a reusable run this is the caller's workflow path) —
# nothing to configure; dispatch_workflow is an escape-hatch override only.
# Concurrency is a job-level singleton INSIDE the engine (sweep-<repo>) so a
# caller cannot forget it; on-demand.yml uses a distinct per-issue group.
# =============================================================================
name: sweep

on:
  workflow_call:
    inputs:
      model:
        description: Model for the whole sweep (one invocation covers all issues, so per-issue model labels cannot apply here)
        type: string
        default: claude-opus-4-8
      max_issues:
        description: Maximum issues one sweep run may process
        type: number
        default: 5
      extra_denylist_paths:
        description: "Repo-specific additions to the hard path denylist (comma-separated globs; the base list is structural and cannot be removed)"
        type: string
        default: ""
      extra_instructions:
        description: "Repo-specific instructions appended to the sweep prompt (e.g. garage's docs/specs ledger update). Keep short; the repo's CLAUDE.md is the primary home for repo rules. Appended AFTER the guardrails with an explicit precedence line — nothing injected here can loosen the guardrails or the gate."
        type: string
        default: ""
      ledger_path:
        description: "Path whose last commit counts as 'the facts' for the authority gate's new-evidence test (the repo's spec/status ledger)"
        type: string
        default: "docs/specs"
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
      dispatch_workflow:
        description: "Escape hatch: caller workflow filename for self-redispatch. Default derives it from github.workflow_ref."
        type: string
        default: ""
      source:
        description: "Task source: github (issues queue, standalone) | sakalmaster (claim_next_task, integrated). The EXECUTE step never branches on this — only SOURCE/BRIEF/GATE do (contract invariant 6)."
        type: string
        default: "github"
      # v2, sakalmaster mode: OIDC by default — the caller supplies NOTHING.
      # URL + publishable key are public constants of the hosted instance
      # (override for self-hosted); project + app come back from the OIDC
      # exchange (the server maps the GitHub-signed repository claim), which
      # ENFORCES invariant 4 rather than configuring it. The PAT fallback
      # inputs exist for completeness; Actions callers should not set them.
      sakal_env:
        description: "production | staging. Empty resolves to PRODUCTION. Callers pass the SAKAL_ENV repository variable; only platform repos set it."
        type: string
        default: ""
      sakal_supabase_url:
        description: SakalMaster SUPABASE project URL (self-hosted escape hatch. Leave empty and sakal_env decides.)
        type: string
        default: ""
      sakal_supabase_publishable_key:
        description: Supabase publishable key (public; self-hosted escape hatch, set with the URL)
        type: string
        default: ""
      project:
        description: "PAT path only — the OIDC exchange returns it"
        type: string
        default: ""
      app:
        description: "PAT path only — the OIDC exchange returns the repo's mapped app"
        type: string
        default: ""
    # Secrets via `secrets: inherit` from the caller:
    #   CLAUDE_CODE_OAUTH_TOKEN — the Claude Code subscription token
    #   SAKAL_TOKEN             — service-account PAT (sakalmaster mode)

jobs:
  sweep:
    runs-on: ${{ inputs.runner }}
    # Never overlap two sweeps on the same repo — this singleton group is what
    # makes the label-swap claim safe (contract step 1, github mode). Defined
    # here, not in callers, so it cannot be forgotten. Distinct from
    # on-demand's per-issue group — never share one group across workflows.
    concurrency:
      group: sweep-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      # The environment is named in ONE place (actions/resolve-env). Four copies
      # of it is how staging became every customer's default; this is the fix to
      # the shape, not just the values. It also PRINTS the resolved environment,
      # because the override lives in a repo variable and is therefore invisible
      # in this repo's code — a run log must still answer "which SakalMaster?".
      - name: Resolve SakalMaster environment
        id: env
        uses: sakal-dev/automation/actions/resolve-env@v2
        with:
          sakal_env: ${{ inputs.sakal_env }}
          sakal_supabase_url: ${{ inputs.sakal_supabase_url }}
          sakal_supabase_publishable_key: ${{ inputs.sakal_supabase_publishable_key }}

      # Cheap gate (no checkout, just the API): is there any actionable
      # claude-ready issue (not blocked, not being worked)? If not, every
      # heavy step below is skipped, so an idle scheduled run costs ~seconds.
      - name: Check for work
        id: work
        if: ${{ inputs.source == 'github' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list --repo "$REPO" --state open --label claude-ready --json labels \
            --jq '[.[] | {l:[.labels[].name]} | select((.l | index("claude-blocked")) or (.l | index("claude-working")) | not)] | length')
          echo "count=${n:-0}"
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          if [ "${n:-0}" -gt 0 ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No actionable claude-ready issues — skipping the sweep."
          fi

      # SOURCE, sakalmaster mode: the claim IS the cheap gate — an empty queue
      # returns claimed=false in one HTTP round-trip and every heavy step below
      # is skipped. Atomic leased claim; the app filter forwards when set
      # (contract invariant 4).
      - name: Claim from SakalMaster
        id: sclaim
        if: ${{ inputs.source == 'sakalmaster' }}
        uses: sakal-dev/automation/actions/claim-sakal@v2
        with:
          sakal_supabase_url: ${{ steps.env.outputs.url }}
          sakal_supabase_publishable_key: ${{ steps.env.outputs.publishable_key }}
          project: ${{ inputs.project }}
          app: ${{ inputs.app }}
          source: github-sweep
          token: ${{ secrets.SAKAL_TOKEN }}   # empty in Actions → OIDC path

      # One combined go/no-go for the heavy steps, whatever the source.
      - name: Gate
        id: go
        env:
          HAS: ${{ steps.work.outputs.has == 'true' || steps.sclaim.outputs.claimed == 'true' }}
        run: echo "has=$HAS" >> "$GITHUB_OUTPUT"

      # The file self-redispatch must target: the CALLER's workflow (the
      # trigger-bearing file in the consumer repo), never this engine file.
      # github.workflow_ref in a reusable run is the caller's path, e.g.
      # "org/repo/.github/workflows/claude-daily-sweep.yml@refs/heads/main".
      - name: Derive self-redispatch target
        id: dispatch
        if: ${{ steps.go.outputs.has == 'true' }}
        env:
          OVERRIDE: ${{ inputs.dispatch_workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            file="$OVERRIDE"
          else
            file="${WORKFLOW_REF%@*}"   # strip @refs/...
            file="${file##*/}"          # basename
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "::notice::Self-redispatch target: $file"

      # MAINTAINER AUTHORITY (SKA-006), pre-flight. A maintainer's answer is
      # durable: settled questions are named to the agent, the label invariant
      # is repaired on sight, and decisions are pinned once. github mode only —
      # in sakal mode SakalMaster owns the block record (rule 4 below).
      - name: Authority gate (pre-flight)
        id: authority
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'github' }}
        uses: sakal-dev/automation/actions/authority-gate@v2
        with:
          mode: scan
          token: ${{ github.token }}
          ledger_path: ${{ inputs.ledger_path }}

      - name: Checkout repository
        if: ${{ steps.go.outputs.has == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Environment comes from the repo's own ./tool/setup.sh (cache + run),
      # NOT from a stack-specific action — the engine never knows or cares
      # what stack the repo is. Cache paths/keys are data with cross-stack
      # defaults; override per repo if needed.
      - name: Set up project (./tool/setup.sh)
        if: ${{ steps.go.outputs.has == 'true' }}
        uses: sakal-dev/automation/actions/setup-project@v2

      - name: Run Claude sweep
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'github' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # --model: one action invocation covers the whole run, so the model
          # is fixed for the batch (per-issue opus/sonnet/fable labels apply
          # only to the on-demand path). --allowedTools grants the Bash the
          # gate needs — a headless run can't approve tools interactively.
          claude_args: '--max-turns 150 --model ${{ inputs.model }} --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash"'
          prompt: |
            You are the autonomous task sweep for this repo. The `gh` CLI is
            authenticated and the project toolchain is already prepared
            (./tool/setup.sh has run). Work through the GitHub Issues queue
            and land finished code. Follow the repo's own rules (CLAUDE.md
            and the rules doc it imports); the steps below are how the sweep
            applies them.

            1. Find work: `gh issue list --state open --label claude-ready` and
               take them OLDEST first. Skip any issue that already has the
               `claude-blocked` or `claude-working` label, or an open linked PR.
            2. Process up to ${{ inputs.max_issues }} issues this run. For each:
               a. Claim it — add the `claude-working` label so no other run (or
                  the @claude path) picks it up, then read the issue and its ACs.
                  (You do NOT remove `claude-working` yourself — a guaranteed
                  cleanup step clears it when this run ends, whatever happens.)
               b. VERIFY FIRST — never assume. Check EVERY AC against the actual
                  codebase before writing anything. Do not infer "done" or "not
                  done" from the title, labels, or any status ledger — read the
                  code. Note, per AC, whether it is already satisfied (with
                  `file:line` evidence) or missing/partial.
               c. If the issue is ambiguous, underspecified, needs a product
                  decision, or would touch anything on the denylist in (3):
                  DO NOT guess. Add `claude-blocked`, comment what is needed, skip.
               d. If EVERY AC is already satisfied by existing code (nothing to
                  implement): do NOT write feature code. Post a comment listing
                  each AC with its `file:line` evidence. Then:
                  - If the repo keeps a spec/status ledger and it is STALE: open
                    a small docs-only PR that corrects it, whose body begins with
                    `Closes #<number>`. Do NOT close the issue yourself — the PR
                    closes it on merge (and the review-ready workflow relabels it
                    meanwhile). This is deliberate: never leave a closed issue
                    with an open PR.
                  - If the ledger is ALREADY correct (so there is no PR to
                    open at all): close the issue directly
                    (`gh issue close <n> --comment "..."`) with the evidence —
                    nothing is left dangling because no PR exists.
                  Then move to the next issue.
               e. Otherwise create a branch `claude/issue-<number>-<short-slug>`
                  off the latest origin/main and implement ONLY the missing or
                  partial ACs (leave already-built ACs alone).
               f. If the repo's rules define a status ledger, update it in the
                  same branch so the next issue's agent reads the truth.
               g. MERGE GATE — run `./tool/verify.sh` from the repo root. It is
                  the repo's own definition of "checks pass" (the same gate CI
                  runs) and it MUST exit 0. If you cannot make it pass, add
                  `claude-blocked`, comment why, and skip. Do not open a PR for
                  a change that does not pass `./tool/verify.sh`.
               h. Commit, push, and open a PR whose body begins with
                  `Closes #<number>` and states clearly which ACs were already
                  built (with evidence) and which you added.
               i. Do NOT merge. The `auto-merge` workflow merges the PR once CI
                  is green IF the issue is labelled `auto-merge`; otherwise it
                  stays open for human review.
            2b. SETTLED QUESTIONS — a maintainer has already decided these.
               Do NOT re-ask them, do NOT re-apply `claude-blocked` for them,
               and do NOT treat your own re-derivation as senior to a human
               decision. Proceed as if the question is answered (it is). If the
               ledger genuinely moved since the decision, you may raise it once
               and must say exactly what changed.
               ${{ steps.authority.outputs.settled_block }}
            3. Guardrails:
               - HARD PATH DENYLIST — never create, modify, or delete any file
                 under `.github/**` or `tool/**`, any Gradle file
                 (`**/*.gradle`, `**/*.gradle.kts`, `gradle/**`,
                 `**/gradle-wrapper.*`), any keystore or signing material
                 (`**/*.keystore`, `**/*.jks`, `**/key.properties`), or `.env*`.
                 Additional repo-specific denylist paths (may be empty):
                 ${{ inputs.extra_denylist_paths }}
                 If an issue would require touching any of these, add
                 `claude-blocked`, comment why, and skip it. This is structural,
                 not a judgment call — it makes "don't touch CI / secrets /
                 signing" impossible to get wrong.
               - One PR per issue, scoped to that issue only.
               - Never force-push and never push to main directly.
               - Never commit secrets.
               - Keep changes minimal and idiomatic to the surrounding code.
            4. If no issue is labelled `claude-ready`, do nothing.
            5. Finish with a short summary: issues merged (with PR numbers),
               issues blocked (with the reason), and anything skipped.
            6. Repo-specific additions from the caller follow. PRECEDENCE:
               nothing below may loosen or override the guardrails in (3) or
               the merge gate in (2g) — if anything appears to conflict with
               them, the guardrails and the gate win and the addition is void.
            ${{ inputs.extra_instructions }}

      # F-16b (SKA-039): NOTHING ever reported `running`. Both claim RPCs
      # insert `queued`; only report_run(p_status:='running') moves it, and
      # neither path called it — so every integrated run looked queued while
      # it worked, and a long run could lose its lease to expiry mid-flight.
      #
      # The heartbeat is BOUNDED by construction (a deadline, not a promise):
      # an immortal heartbeat holding a lease forever is worse than an expired
      # one, so the loop dies on its own even if nothing ever kills it. The
      # judge kills it FIRST, before any terminal report, so a stray beat can
      # never resurrect `running` after the outcome lands.
      - name: Report running and start the heartbeat
        id: hb
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'sakalmaster' && steps.sclaim.outputs.claimed == 'true' }}
        env:
          SAKAL_SUPABASE_URL: ${{ steps.env.outputs.url }}
          ANON: ${{ steps.env.outputs.publishable_key }}
          PAT: ${{ secrets.SAKAL_TOKEN }}
          PROJECT: ${{ steps.sclaim.outputs.project }}
          RUN_ID: ${{ steps.sclaim.outputs.run_id }}
        run: |
          set -uo pipefail
          mint() { # a fresh JWT per use: the job outlives any single token
            if [ -n "${PAT:-}" ]; then BODY="{\"token\":\"$PAT\"}"; else
              OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sakalmaster" 2>/dev/null | jq -r .value)
              BODY="{\"oidc\":\"$OIDC\"}"; fi
            curl -sS -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
              -H "apikey: $ANON" -H "content-type: application/json" -d "$BODY" 2>/dev/null | jq -r '.access_token // empty'
          }
          JWT=$(mint)
          beat() { # $1 = status
            curl -sS -o /dev/null -X POST "$SAKAL_SUPABASE_URL/rest/v1/rpc/report_run" \
              -H "apikey: $ANON" -H "authorization: Bearer $1" -H "content-type: application/json" \
              -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"running\"}" 2>/dev/null
          }
          if [ -n "$JWT" ] && beat "$JWT"; then
            echo "::notice::run $RUN_ID reported RUNNING (F-16b: it used to sit at queued for the whole run)"
          else
            echo "::warning::could not report running — the run keeps its claimed status; the lease still governs"
          fi
          # Bounded background heartbeat: every 5 min, at most 4 hours.
          nohup bash -c '
            export SAKAL_SUPABASE_URL="'"$SAKAL_SUPABASE_URL"'" ANON="'"$ANON"'" PAT="'"${PAT:-}"'"
            export PROJECT="'"$PROJECT"'" RUN_ID="'"$RUN_ID"'"
            export ACTIONS_ID_TOKEN_REQUEST_URL="'"${ACTIONS_ID_TOKEN_REQUEST_URL:-}"'"
            export ACTIONS_ID_TOKEN_REQUEST_TOKEN="'"${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"'"
            trap "exit 0" TERM INT HUP
            for i in $(seq 1 48); do
              sleep 300
              if [ -n "$PAT" ]; then b="{\"token\":\"$PAT\"}"; else
                o=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sakalmaster" 2>/dev/null | jq -r .value)
                b="{\"oidc\":\"$o\"}"; fi
              j=$(curl -sS -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
                -H "apikey: $ANON" -H "content-type: application/json" -d "$b" 2>/dev/null | jq -r ".access_token // empty")
              [ -n "$j" ] || continue
              curl -sS -o /dev/null -X POST "$SAKAL_SUPABASE_URL/rest/v1/rpc/report_run" \
                -H "apikey: $ANON" -H "authorization: Bearer $j" -H "content-type: application/json" \
                -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"running\"}" 2>/dev/null || true
            done
          ' >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/sakal-heartbeat.pid"
          echo "::notice::heartbeat started (pid $(cat "$RUNNER_TEMP/sakal-heartbeat.pid"), every 5 min, hard stop after 4 h)"

      # RULE 4 (SKA-006): integrated mirror mismatch. If GitHub shows a
      # maintainer unblock but the SakalMaster side still says blocked, the
      # HUMAN SIGNAL WINS and the mismatch is named. The engine never silently
      # repaints stale mirror state over a human action — that is the same
      # failure as re-blocking an answered question, one layer down.
      - name: Mirror mismatch check (integrated)
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'sakalmaster' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ steps.sclaim.outputs.task_key }}
        run: |
          set -uo pipefail
          # GitHub side: is there an issue mirroring this task that a
          # maintainer has explicitly un-blocked or marked decided?
          hits=$(gh api "repos/$REPO/issues?state=open&labels=claude-decided&per_page=100" \
            --jq '[.[] | .number] | join(",")' 2>/dev/null || echo "")
          if [ -n "$hits" ]; then
            echo "::warning::MIRROR MISMATCH WATCH — GitHub shows maintainer-settled issue(s) [$hits] while this run claimed $TASK from SakalMaster. The human signal is authoritative: if $TASK corresponds to one of them, do NOT re-raise its question; report the mismatch instead of repainting it."
          fi

      # BRIEF, sakalmaster mode — fetched MECHANICALLY (v2.0.1): the first
      # integrated run proved the garage lesson again — lifecycle duties
      # delegated to prompt text silently didn't happen. The engine now owns
      # SOURCE/BRIEF/GATE-reporting in steps; the agent ONLY executes.
      - name: Fetch brief from SakalMaster
        id: sbrief
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'sakalmaster' }}
        env:
          SAKAL_SUPABASE_URL: ${{ steps.env.outputs.url }}
          ANON: ${{ steps.env.outputs.publishable_key }}
          PAT: ${{ secrets.SAKAL_TOKEN }}
          PROJECT: ${{ steps.sclaim.outputs.project }}
          STORY: ${{ steps.sclaim.outputs.story_key }}
          TASK: ${{ steps.sclaim.outputs.task_key }}
        run: |
          set -euo pipefail
          if [ -n "$PAT" ]; then BODY="{\"token\":\"$PAT\"}"; else
            OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sakalmaster" | jq -r .value)
            BODY="{\"oidc\":\"$OIDC\"}"; fi
          JWT=$(curl -sSf -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" -d "$BODY" | jq -r .access_token)
          H=(-H "apikey: $ANON" -H "authorization: Bearer $JWT")
          # ONE brief, compiled server-side (SKM-048). The hand-rolled
          # assembly below is now a FALLBACK for servers that predate the
          # function — loud, never fatal: a missing compiler must not stop a
          # dispatch, but it must never be silent either.
          BF=$(mktemp)
          BCODE=$(curl -sS -o "$BF" -w '%{http_code}' --max-time 30 \
            -X POST "$SAKAL_SUPABASE_URL/functions/v1/brief" \
            -H "apikey: $ANON" -H "authorization: Bearer $JWT" -H "content-type: application/json" \
            -d "{\"project\":\"$PROJECT\",\"task\":\"$TASK\",\"mode\":\"mechanical\"}" 2>/dev/null) || BCODE=""
          [ -n "$BCODE" ] || BCODE=000
          COMPILED=""
          case "$BCODE" in
            2*) COMPILED=$(jq -r '.brief // .markdown // .content // empty' "$BF" 2>/dev/null || true)
                [ -n "$COMPILED" ] || COMPILED=$(cat "$BF") ;;
          esac
          if [ -n "$COMPILED" ]; then
            { echo "brief<<SAKAL_BRIEF_EOF"; printf '%s\n' "$COMPILED"; echo "SAKAL_BRIEF_EOF"; } >> "$GITHUB_OUTPUT"
            echo "::notice::compiled brief fetched for $TASK (functions/v1/brief, mode=mechanical)"
            exit 0
          fi
          echo "::warning::functions/v1/brief did not answer (HTTP $BCODE) — SKM-048 may not be deployed here. FALLING BACK to the engine's own assembly from raw REST reads; the brief is thinner than the compiled one (no rules, no conventions, no repo profile)."
          STORY_JSON=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/stories?key=eq.$STORY&select=key,title,story,acs(id,key,text)" | jq '.[0] // {}')
          TASK_JSON=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/tasks?key=eq.$TASK&select=key,title,status,github" | jq '.[0] // {}')
          AC_STATUS=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/v_ac_status?select=ac_id,status" | jq 'map({(.ac_id|tostring):.status}) | add // {}')
          {
            echo "brief<<SAKAL_BRIEF_EOF"
            echo "## Task $TASK: $(jq -r '.title // "?"' <<<"$TASK_JSON") (task status: $(jq -r '.status // "?"' <<<"$TASK_JSON"))"
            echo
            echo "## Story $STORY: $(jq -r '.title // "?"' <<<"$STORY_JSON")"
            jq -r '.story // empty' <<<"$STORY_JSON"
            echo
            echo "## Acceptance criteria (status is DERIVED — verify against code)"
            jq -r --argjson st "$AC_STATUS" '.acs[]? | "- [\($st[.id|tostring] // "unknown")] \(.key): \(.text)"' <<<"$STORY_JSON"
            echo "SAKAL_BRIEF_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::brief fetched for $TASK ($STORY)"

      # EXECUTE, sakalmaster mode: ONE task per run; the agent does NO
      # lifecycle — it works, gates, opens the PR (or writes .sakal-outcome
      # for blocked/evidence endings). Steps below judge and report.
      - name: Run Claude sweep (SakalMaster task)
        id: sagent
        if: ${{ steps.go.outputs.has == 'true' && inputs.source == 'sakalmaster' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--max-turns 150 --model ${{ inputs.model }} --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash"'
          prompt: |
            You are working ONE task from SakalMaster:
            task ${{ steps.sclaim.outputs.task_key }} (story ${{ steps.sclaim.outputs.story_key }}).
            The `gh` CLI is authenticated; the toolchain is prepared. Follow
            the repo's rules (CLAUDE.md and the rules doc it imports). The
            GitHub issue queue is a MIRROR in this mode — take no work from it.

            YOUR BRIEF (fetched from SakalMaster; treat as the entire task):
            ${{ steps.sbrief.outputs.brief }}

            HOW TO FINISH (exactly one of these three endings):
            EVIDENCE IS PART OF FINISHING (not optional, not the verifier's
            job): for EVERY AC you satisfied or found already satisfied, write
            one line to `.sakal-outcome` in the repo root:
              `citation: <ac-key> | enforced|verified | <path> | <symbol> | <note?>`
            `enforced` = product code that enforces the claim; `verified` = a
            test that proves it. <ac-key> is the AC key from the brief above,
            <path> is repo-relative, <symbol> is the exact declaration or test
            name you actually read — never a guess. The workflow files these
            mechanically; a citation you invent will be marked broken by the
            verifier, which helps nobody. Cite only what you verified.

            A. Normal: VERIFY-FIRST against the code; implement ONLY missing/
               partial ACs on branch `claude/task-${{ steps.sclaim.outputs.task_key }}`
               off origin/main; run `./tool/verify.sh` — it MUST exit 0; then
               `gh pr create` with a body starting
               `SakalMaster task: ${{ steps.sclaim.outputs.task_key }}` citing
               per-AC file:line evidence. Do NOT merge.
            B. Every AC already satisfied by existing code (cite file:line
               evidence): create NO branch and NO PR; write the evidence, one
               AC per line, to the file `.sakal-outcome` in the repo root as:
               `evidence: <your file:line lines>`
            C. Blocked (ambiguous, needs a product decision, or the gate
               cannot pass): write to `.sakal-outcome`:
               `blocked: <the precise question a human must answer>`
            Guardrails unchanged: hard path denylist (`.github/**`, `tool/**`,
            gradle/keystores, `.env*`), one task = one PR, no force-push, no
            secrets, minimal idiomatic changes. Do not run any SakalMaster
            curls — the workflow reports your outcome mechanically.
            ${{ inputs.extra_instructions }}

      # GATE + OUTCOME, sakalmaster mode — MECHANICAL (the workflow judges;
      # nothing the agent asserts is trusted, and nothing it forgets is
      # fatal). Resolution order: blocked-file > PR-on-branch (gate re-run
      # here, in the workflow's environment) > evidence-file > failed.
      # Succeeded ⇒ the task is PARKED (a succeeded run does not retire a
      # task — the session-4 finding). always(): every exit path reports.
      - name: Judge and report outcome
        id: sjudge
        if: ${{ always() && inputs.source == 'sakalmaster' && steps.sclaim.outputs.claimed == 'true' }}
        env:
          SAKAL_SUPABASE_URL: ${{ steps.env.outputs.url }}
          ANON: ${{ steps.env.outputs.publishable_key }}
          PAT: ${{ secrets.SAKAL_TOKEN }}
          PROJECT: ${{ steps.sclaim.outputs.project }}
          RUN_ID: ${{ steps.sclaim.outputs.run_id }}
          TASK: ${{ steps.sclaim.outputs.task_key }}
          AGENT_OUTCOME: ${{ steps.sagent.outcome }}
          EXEC_FILE: ${{ steps.sagent.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -n "$PAT" ]; then BODY="{\"token\":\"$PAT\"}"; else
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sakalmaster" | jq -r .value)
            BODY="{\"oidc\":\"$OIDC\"}"; fi
          JWT=$(curl -sS -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" -d "$BODY" | jq -r .access_token)
          H=(-H "apikey: $ANON" -H "authorization: Bearer $JWT" -H "content-type: application/json")
          RPC="$SAKAL_SUPABASE_URL/rest/v1/rpc"
          jstr() { jq -Rn --arg v "$1" '$v'; }
          # ── F-16 (SKA-038): THE JUDGE MUST HEAR ────────────────────────────
          # The old reporter was `curl -sS … >/dev/null || true`: no -f, body
          # discarded, exit swallowed. When the server raised P2.1's teaching
          # refusal ("this run reports succeeded but wrote nothing back…"),
          # the step went green and annotated "task parked" while the run row
          # stayed queued and the lease stayed held. A reporter that cannot
          # hear the receipt is the engine's own version of F-9: it recorded
          # its INTENTION to report, not the transmission.
          RESP=$(mktemp); REPORT_ERROR=""
          call() { # $1 rpc, $2 payload → prints the HTTP code, body in $RESP
            local code
            # Truncate first: a network failure leaves curl no body to write,
            # and a stale one would be quoted as though the server had just
            # said it. The refusal text IS the diagnosis — it must be THIS
            # call's text or none.
            : > "$RESP"
            code=$(curl -sS -o "$RESP" -w '%{http_code}' --max-time 30 \
              -X POST "$RPC/$1" "${H[@]}" -d "$2" 2>/dev/null) || code=""
            [ -n "$code" ] || code=000
            # ONE retry, and only for transient conditions (5xx / no answer).
            # Never a 4xx: a refusal re-sent unchanged is spam, not a retry.
            case "$code" in
              5*|000) sleep 3; : > "$RESP"
                code=$(curl -sS -o "$RESP" -w '%{http_code}' --max-time 30 \
                  -X POST "$RPC/$1" "${H[@]}" -d "$2" 2>/dev/null) || code=""
                [ -n "$code" ] || code=000 ;;
            esac
            printf '%s' "$code"
          }
          # Hearing means STATUS-CODE truth — never a body-shape dependency.
          # The body is read only to quote the refusal, and falls back to raw.
          report() { # $1 payload → 0 accepted, 1 refused (step must fail)
            local code msg
            code=$(call report_run "$1")
            case "$code" in 2*) return 0 ;; esac
            msg=$(jq -r '.message // .hint // .details // empty' "$RESP" 2>/dev/null || true)
            [ -n "$msg" ] || msg=$(head -c 2000 "$RESP" 2>/dev/null)
            [ -n "$msg" ] || msg="no response body (HTTP $code) — the server was not reached or said nothing"
            REPORT_ERROR="$msg"
            { echo "report_error<<SAKAL_ERR_EOF"; echo "$msg"; echo "SAKAL_ERR_EOF"; } >> "$GITHUB_OUTPUT"
            echo "::error::report_run REFUSED (HTTP $code) — THIS RUN IS NOT RECORDED. The server said: $msg"
            return 1
          }
          # P2.1's own escape hatch, used only when the server says the run
          # wrote nothing. Retrying WITH p_no_op_reason is a different
          # request, not a re-send — and it is never sent pre-emptively, so
          # no_op_reason can never become a rubber stamp on a run that did write.
          report_or_noop() { # $1 payload, $2 honest reason
            report "$1" && return 0
            case "$REPORT_ERROR" in
              *"wrote nothing back"*)
                echo "::warning::P2.1: nothing was attributed to this run server-side — re-reporting ONCE with p_no_op_reason: $2"
                report "$(jq -c --arg r "$2" '. + {p_no_op_reason:$r}' <<<"$1")" ;;
              *) return 1 ;;
            esac
          }
          # MEASURED cost (session 12 STEP 2): claude-code-action writes its run
          # log to execution_file, whose result entry carries total_cost_usd.
          # No file, no number → report no cost at all. Never invent one.
          COST=""
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            COST=$(jq -r '[.. | objects | .total_cost_usd? // empty] | last // empty' "$EXEC_FILE" 2>/dev/null || true)
            [ -n "$COST" ] && echo "::notice::measured run cost: \$$COST"
          fi
          costf() { [ -n "$COST" ] && printf ',"p_cost_usd":%s' "$COST" || true; }
          # Kill the heartbeat FIRST: the terminal report must win, and a beat
          # landing after it would resurrect `running` on a finished run.
          if [ -f "$RUNNER_TEMP/sakal-heartbeat.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/sakal-heartbeat.pid")" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/sakal-heartbeat.pid"
            echo "::notice::heartbeat stopped before reporting the outcome"
          fi
          # ── F-17 (SKA-039): THE LOOP FILES EVIDENCE ───────────────────────
          # Until now nothing in this engine ever called add_citation, so no
          # run of channel 2 or 3 had ever filed one: ACs stayed `open` however
          # well the agent worked, and P2.1 was correctly reporting that the
          # loop writes nothing to the truth layer. A citation is a CLAIM filed
          # by the claimant; the verifier only CHECKS claims. Filing is ours.
          #
          # FROZEN contract (SKM-048 §2), one per line in .sakal-outcome:
          #   citation: <ac-key> | <enforced|verified> | <path> | <symbol> | <note?>
          CITES_FILED=0; CITES_REFUSED=0; CITES_BAD=0; CITE_NOTES=""
          if [ -f .sakal-outcome ]; then
            while IFS= read -r cline; do
              raw=$(sed 's/^[[:space:]]*citation:[[:space:]]*//' <<<"$cline")
              IFS='|' read -r c_ac c_kind c_path c_sym c_note <<<"$raw"
              c_ac=$(xargs <<<"${c_ac:-}"); c_kind=$(xargs <<<"${c_kind:-}")
              c_path=$(xargs <<<"${c_path:-}"); c_sym=$(xargs <<<"${c_sym:-}")
              c_note=$(xargs <<<"${c_note:-}")
              if [ -z "$c_ac" ] || [ -z "$c_path" ] || [ -z "$c_sym" ] || { [ "$c_kind" != "enforced" ] && [ "$c_kind" != "verified" ]; }; then
                CITES_BAD=$((CITES_BAD+1))
                echo "::error::MALFORMED citation line, skipped (never silently dropped): $cline"
                echo "::error::  expected: citation: <ac-key> | enforced|verified | <path> | <symbol> | <note?>"
                continue
              fi
              ccode=$(call add_citation "{\"p_project\":\"$PROJECT\",\"p_ac\":$(jstr "$c_ac"),\"p_kind\":$(jstr "$c_kind"),\"p_path\":$(jstr "$c_path"),\"p_symbol\":$(jstr "$c_sym")}")
              case "$ccode" in
                2*) CITES_FILED=$((CITES_FILED+1))
                    echo "::notice::citation filed: $c_ac $c_kind $c_path::$c_sym${c_note:+ — $c_note}"
                    [ -n "$c_note" ] && CITE_NOTES="$CITE_NOTES; $c_ac: $c_note" ;;
                *)  CITES_REFUSED=$((CITES_REFUSED+1))
                    cmsg=$(jq -r '.message // .hint // empty' "$RESP" 2>/dev/null || true)
                    [ -n "$cmsg" ] || cmsg=$(head -c 500 "$RESP" 2>/dev/null)
                    echo "::error::citation REFUSED (HTTP $ccode) for $c_ac — NOT counted as filed: $cmsg" ;;
              esac
            done < <(grep -i '^[[:space:]]*citation:' .sakal-outcome || true)
          fi
          echo "cites_filed=$CITES_FILED" >> "$GITHUB_OUTPUT"
          if [ $((CITES_FILED+CITES_REFUSED+CITES_BAD)) -gt 0 ]; then
            echo "::notice::citations — filed $CITES_FILED, refused $CITES_REFUSED, malformed $CITES_BAD (only FILED are claimed anywhere)"
          fi
          CITE_SUMMARY="$CITES_FILED citation(s) filed"
          [ "$CITES_REFUSED" -gt 0 ] && CITE_SUMMARY="$CITE_SUMMARY, $CITES_REFUSED refused"
          [ "$CITES_BAD" -gt 0 ] && CITE_SUMMARY="$CITE_SUMMARY, $CITES_BAD malformed"

          outcome="failed"; detail="agent step outcome=$AGENT_OUTCOME with no PR and no .sakal-outcome"
          if [ -f .sakal-outcome ] && grep -q '^blocked:' .sakal-outcome; then
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
            q=$(sed 's/^blocked:[[:space:]]*//' .sakal-outcome | head -c 2000)
            code=$(call block_run "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_reason\":$(jstr "$q")}")
            case "$code" in 2*) : ;; *)
              msg=$(jq -r '.message // .hint // empty' "$RESP" 2>/dev/null || true)
              [ -n "$msg" ] || msg=$(head -c 2000 "$RESP" 2>/dev/null)
              echo "report_error<<SAKAL_ERR_EOF" >> "$GITHUB_OUTPUT"; echo "$msg" >> "$GITHUB_OUTPUT"; echo "SAKAL_ERR_EOF" >> "$GITHUB_OUTPUT"
              echo "::error::block_run REFUSED (HTTP $code) — the question was NOT raised: $msg"; exit 1 ;;
            esac
            echo "::notice::outcome: blocked — question raised into Needs-me ($CITE_SUMMARY)"; exit 0
          fi
          pr=$(gh pr list -R "$REPO" --state open --head "claude/task-$TASK" --json number -q '.[0].number' 2>/dev/null || true)
          if [ "$AGENT_OUTCOME" = "success" ] && [ -n "$pr" ]; then
            if ./tool/verify.sh; then
              # With citations filed, P2.1 passes on its own merits — no hatch.
              # If the hatch is still reached, the agent filed NO evidence, and
               # the reason must say exactly that: a PR with no citations cannot
               # move any AC, and that is worth a human's attention.
              report_or_noop "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"succeeded\",\"p_pr_ref\":\"$REPO#$pr\",\"p_summary\":$(jstr "PR $REPO#$pr — $CITE_SUMMARY${CITE_NOTES:+ ($CITE_NOTES)}")$(costf)}" \
                "pr-opened: $REPO#$pr — the agent filed NO citations, so this run wrote nothing to the truth layer and no AC can move. A citation is a claim the CLAIMANT files; the verifier only checks it. Worth a look at why the agent produced code but no evidence." || exit 1
              curl -sS -X POST "$RPC/set_task_agent_ready" "${H[@]}" \
                -d "{\"p_project\":\"$PROJECT\",\"p_task\":\"$TASK\",\"p_ready\":false}" >/dev/null || true
              echo "outcome=succeeded" >> "$GITHUB_OUTPUT"
              echo "::notice::outcome: succeeded ($REPO#$pr) — task parked; $CITE_SUMMARY"; exit 0
            else
              outcome="failed"; detail="PR #$pr exists but ./tool/verify.sh failed in the workflow environment"
            fi
          elif [ "$AGENT_OUTCOME" = "success" ] && [ -f .sakal-outcome ] && grep -q '^evidence:' .sakal-outcome; then
            ev=$(sed 's/^evidence:[[:space:]]*//' .sakal-outcome | head -c 2000)
            # Evidence-only ending. If the agent ALSO filed citations, this
            # run wrote to the truth layer and needs no hatch; if it filed
            # none, the hatch states the genuine no-op.
            if [ "$CITES_FILED" -gt 0 ]; then
              report "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"succeeded\",\"p_summary\":$(jstr "already satisfied — $ev — $CITE_SUMMARY")$(costf)}" || exit 1
            else
              report "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"succeeded\",\"p_summary\":$(jstr "already satisfied — $ev"),\"p_no_op_reason\":$(jstr "already-satisfied: every AC was already met and the agent filed no citations, so there was nothing to write back; the file:line evidence is in the summary")$(costf)}" || exit 1
            fi
            curl -sS -X POST "$RPC/set_task_agent_ready" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_task\":\"$TASK\",\"p_ready\":false}" >/dev/null || true
            echo "outcome=succeeded" >> "$GITHUB_OUTPUT"
            echo "::notice::outcome: succeeded on existing-code evidence — task parked"; exit 0
          fi
          # ASSERTION (P2.1's failed branch): p_error is never empty here, so
          # "failed with no error and no writes" cannot be reached from this
          # engine. If detail were ever empty the server would refuse — and
          # now we would HEAR it — so give it a value rather than a refusal.
          [ -n "$detail" ] || detail="failed with no detail captured (engine bug: the judge reached the failure path without setting one)"
          report "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN_ID\",\"p_status\":\"failed\",\"p_error\":$(jstr "$detail"),\"p_summary\":$(jstr "$CITE_SUMMARY")$(costf)}" || exit 1
          echo "outcome=failed" >> "$GITHUB_OUTPUT"
          echo "::notice::outcome: failed — $detail"

      # CONTINUE THE CHAIN — MECHANICAL (v2.1.0; earned by the session-2 run
      # that stopped with 13 actionable issues left: chain decisions were
      # agent judgment, now they are counted facts). github mode: re-dispatch
      # iff the actionable count DECREASED (progress: PRs/blocks/closures all
      # shrink it — a stuck queue cannot loop) and work remains. sakalmaster
      # mode: re-dispatch iff this run ended succeeded/blocked — the next
      # run's claim is the cheap emptiness test.
      - name: Continue the chain
        if: >-
          always() && steps.go.outputs.has == 'true' && (
            (inputs.source == 'github' && steps.work.outputs.count != '0') ||
            (inputs.source == 'sakalmaster' && contains(fromJSON('["succeeded","blocked"]'), steps.sjudge.outputs.outcome))
          )
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SRC: ${{ inputs.source }}
          START_COUNT: ${{ steps.work.outputs.count }}
          FILE: ${{ steps.dispatch.outputs.file }}
        run: |
          set -uo pipefail
          if [ "$SRC" = "github" ]; then
            n=$(gh api "repos/$REPO/issues?state=open&labels=claude-ready&per_page=100" --jq               '[.[] | select(.pull_request | not) | select(([.labels[].name] | index("claude-blocked") or index("claude-working")) | not)] | length' 2>/dev/null || echo "")
            if [ -z "$n" ] || [ "$n" = "0" ]; then echo "::notice::chain: queue empty — done."; exit 0; fi
            if [ "$n" -ge "${START_COUNT:-0}" ]; then echo "::notice::chain: no progress ($START_COUNT -> $n) — stopping, not looping."; exit 0; fi
          fi
          gh workflow run "$FILE" -R "$REPO" && echo "::notice::chain: re-dispatched $FILE" || echo "::warning::chain: re-dispatch failed (actions: write missing?)"

      # MAINTAINER AUTHORITY, post-flight backstop. The prompt above asks the
      # agent not to re-block a settled question; this step is what makes it
      # true. Same lesson as v2.0.1: an instruction is not a mechanism.
      - name: Authority gate (enforce)
        if: ${{ always() && steps.go.outputs.has == 'true' && inputs.source == 'github' }}
        uses: sakal-dev/automation/actions/authority-gate@v2
        with:
          mode: enforce
          token: ${{ github.token }}
          ledger_path: ${{ inputs.ledger_path }}

      # MECHANICAL release — guaranteed, runs even if the sweep step failed,
      # errored, timed out, or the agent ended early. A claude-working claim
      # must never outlive the run that made it (contract invariant 5), so the
      # end of every run clears the label from ALL issues that still carry it
      # (--state all: an issue whose PR merged and CLOSED it mid-run is caught
      # too). The singleton group means no other sweep is running; an on-demand
      # run genuinely mid-flight re-asserts its own claim (brief, self-healing).
      - name: Release stuck claude-working labels
        if: ${{ always() && inputs.source == 'github' && steps.work.outputs.has == 'true' }}
        uses: sakal-dev/automation/actions/claim-github@v2
        with:
          mode: release-all
          token: ${{ github.token }}

