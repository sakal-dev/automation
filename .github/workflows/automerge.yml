# =============================================================================
# automerge.yml — precondition-gated merge (METHOD 3 engine; judges every PR)
# Extracted from sakalpos-garage's automerge.yml; hardening intact. Contract:
# docs/task-contract.md step 4 (gate) + step 4b (review) — merge is OPT-IN per
# task, review is the default (invariant 2), and since v2.5.0 the FULL
# precondition set is required, not just "CI is green".
#
# THE PRECONDITION SET (invariant 10). All of them, every time:
#   • the PR is open and not a draft
#   • `auto-merge` on the PR or a linked issue        (opt-in, unchanged)
#   • no guardrail path touched                       (unchanged)
#   • no `needs-human-merge` / `review:escalated` / `review:broken-anchors`
#   • no `priority:urgent`                            (RULES §6, now enforced)
#   • the named CI check is green
#   • at least one CURRENT approval — an approval given for a commit that is no
#     longer the head is void
#   • zero open change-requests (latest review per reviewer)
#   • zero unresolved review threads
#   • GitHub's own reviewDecision / mergeStateStatus does not disagree
#
# DOCS-ONLY keeps its reviewless fast path (deliberate): a PR whose every file
# the repo's CI path-ignores waives the CI check and the approval. It does NOT
# waive an open change-request or an unresolved thread — most-restrictive-wins
# outranks the fast path, because a human who said "no" to a docs PR said no.
#
# GUARDRAIL PRECEDENCE is unchanged: the guardrail check runs FIRST, so a file
# matching both guardrail_paths and docs_only_paths is a guardrail file and its
# PR is disqualified from the fast path entirely.
#
# ALL of the judging lives in actions/review-state — one evaluator, shared with
# review-loop.yml and the replay test, so the merge gate and the rework loop can
# never disagree about the state of a PR. This file only gathers candidates and
# performs the merge.
#
# ⚠ ROLL-OUT NOTE (require_approval). A repo with no reviewer identity has
# nothing that can ever approve, so `require_approval: true` means agent PRs
# stop auto-merging and wait for a human — correct, but a change of behaviour.
# Set `require_approval: false` to keep the pre-v2.5 behaviour until a reviewer
# identity exists (SKA-011). The engine says so out loud on every such PR
# rather than letting it sit silently.
#
# How a repo calls it. Triggers live in the caller: CI completion (normal path
# for code PRs) plus the PR events that matter for docs-only PRs (which produce
# NO CI-completion event), for `auto-merge` labelled after CI went green, and
# for reviews (an approval is now a merge trigger). Callers MUST declare
# permissions (silent 403s otherwise):
#
#   name: Auto-merge
#   on:
#     workflow_run:
#       workflows: ["CI"]         # the caller repo's CI workflow name
#       types: [completed]
#     pull_request:
#       types: [opened, reopened, ready_for_review, labeled, synchronize]
#     pull_request_review:
#       types: [submitted, dismissed]
#   permissions:
#     contents: write        # merge + delete branch
#     pull-requests: write   # merge PRs
#     issues: write          # read auto-merge label + close linked issue
#     checks: read           # read the named check's conclusion on the head
#   jobs:
#     automerge:
#       uses: sakal-dev/automation/.github/workflows/automerge.yml@v2
#       secrets: inherit
# =============================================================================
name: automerge

on:
  workflow_call:
    inputs:
      ci_check_name:
        description: The check-run name that must be green before merging (the caller repo's CI job)
        type: string
        default: analyze-and-test
      guardrail_paths:
        description: "Comma-separated globs that NEVER auto-merge (extendable per repo; these protect the agent's own rules and the gate)"
        type: string
        default: "CLAUDE.md,docs/RULES.md,.github/**"
      docs_only_paths:
        description: "Comma-separated globs the repo's CI path-ignores; a PR touching ONLY these merges without requiring the CI check or an approval (keep in sync with the caller's CI paths-ignore)"
        type: string
        default: "docs/**,**/*.md"
      require_approval:
        description: "Require at least one CURRENT approval before auto-merging (contract step 4b). Set false ONLY while the repo has no reviewer identity that could ever approve — see the roll-out note above."
        type: boolean
        default: true
      merge_method:
        description: "merge | squash | rebase. NOTE: rebase and squash REWRITE the merged commits; that is fine at merge time (the PR is over) but never during a review."
        type: string
        default: merge
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  automerge:
    # React to: a CI completion; a PR opened/reopened/ready/synchronized; the
    # auto-merge label specifically (other labels would be pointless runs); or
    # a review — since v2.5.0 an approval is a merge trigger, and a dismissal
    # can make a previously-mergeable PR un-mergeable.
    if: >-
      github.event_name == 'workflow_run' ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'auto-merge')
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: automerge-${{ github.event.workflow_run.id || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    steps:
      # 1) Which PRs is this event about?
      - name: Gather candidate PRs
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "CI concluded '${{ github.event.workflow_run.conclusion }}' — nothing to merge."
              echo "prs=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Find the open PR(s) for the branch CI ran on, via `gh pr list`
            # (needs only pull-requests:read). NOT `gh api actions/runs/<id>
            # --jq .pull_requests` — that needs actions:read (403s here) and
            # its `.pull_requests` array is unreliable.
            prs="$(gh pr list -R "$REPO" \
              --head "${{ github.event.workflow_run.head_branch }}" \
              --state open --json number -q '.[].number' 2>/dev/null || true)"
          else
            prs="${{ github.event.pull_request.number }}"
          fi
          echo "prs=$(echo $prs)" >> "$GITHUB_OUTPUT"
          [ -z "$prs" ] && echo "No candidate PRs."
          exit 0

      # 2) Judge. The evaluator is pure — it merges nothing and writes nothing;
      #    its check log is the artefact an operator reads when a PR did not
      #    merge, so it prints the facts for every candidate, held or not.
      - name: Evaluate merge preconditions
        id: state
        if: ${{ steps.candidates.outputs.prs != '' }}
        uses: sakal-dev/automation/actions/review-state@v2
        with:
          prs: ${{ steps.candidates.outputs.prs }}
          token: ${{ github.token }}
          ci_check_name: ${{ inputs.ci_check_name }}
          guardrail_paths: ${{ inputs.guardrail_paths }}
          docs_only_paths: ${{ inputs.docs_only_paths }}
          require_approval: ${{ inputs.require_approval }}

      # 3) Merge what passed; say plainly why the rest did not.
      - name: Merge what passed
        if: ${{ steps.candidates.outputs.prs != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERDICTS: ${{ steps.state.outputs.verdicts }}
          METHOD: ${{ inputs.merge_method }}
          REQUIRE_APPROVAL: ${{ inputs.require_approval }}
        run: |
          set -uo pipefail
          # Comment bodies are built with printf, never as a multi-line shell
          # string: a line at column 0 inside a `run: |` block ends the YAML
          # block scalar and the workflow stops parsing.
          body() { printf '%s\n' "$@"; }

          echo "$VERDICTS" | jq -r '.[] | "#\(.pr): \(.decision)" + (if (.reasons|length)>0 then "\n" + (.reasons | map("    - " + .) | join("\n")) else "" end)'

          # A PR that needs an approval nobody can give would sit silently
          # forever. Say so ONCE, in the log and on the PR — a silent stall is
          # the worst possible failure mode for a merge gate.
          for pr in $(jq -r '.[] | select(.decision=="hold") | select(.reasons[]? | test("no approval")) | .pr' <<<"$VERDICTS"); do
            reviewers=$(gh api "repos/$REPO/pulls/$pr/reviews" --jq 'length' 2>/dev/null || echo 0)
            requested=$(gh api "repos/$REPO/pulls/$pr/requested_reviewers" --jq '(.users|length) + (.teams|length)' 2>/dev/null || echo 0)
            if [ "${reviewers:-0}" = "0" ] && [ "${requested:-0}" = "0" ]; then
              echo "::warning::#$pr needs an approval but has no reviewer and none requested. If this repo has no reviewer identity yet, nothing will ever approve it — either request a reviewer, or set require_approval: false on the automerge caller until one exists (SKA-011)."
              marker="<!-- sakal-review-noreviewer: pr=$pr -->"
              if ! gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF "$marker"; then
                gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$(body \
                  "This PR meets every merge precondition except one: it needs at least one approval, and no reviewer has been requested." \
                  "" \
                  "Nothing in this repository will approve it on its own. Either request a reviewer, approve it yourself, or — if this repo has no reviewer identity yet — set \`require_approval: false\` on the auto-merge caller until one exists." \
                  "" \
                  "$marker")" >/dev/null 2>&1 || true
              fi
            fi
          done

          for pr in $(jq -r '.[] | select(.decision=="merge") | .pr' <<<"$VERDICTS"); do
            docs=$(jq -r --arg p "$pr" '.[] | select(.pr==($p|tonumber)) | .facts.docs_only' <<<"$VERDICTS")
            linked=$(jq -r --arg p "$pr" '.[] | select(.pr==($p|tonumber)) | .facts.linked' <<<"$VERDICTS")
            echo "Merging #$pr (all preconditions met; docs_only=$docs)."
            if gh pr merge "$pr" -R "$REPO" "--$METHOD" --delete-branch; then
              # GitHub's native "Closes #n" auto-close is laggy/unreliable here
              # (the closing link often isn't indexed by merge time, and it's
              # suppressed entirely when the merge is done by GITHUB_TOKEN), so
              # close the linked issues explicitly. Idempotent if already closed.
              for iss in $linked; do
                gh issue close "$iss" -R "$REPO" --reason completed \
                  --comment "Landed via #$pr." >/dev/null 2>&1 \
                  && echo "Closed #$iss (merged via #$pr)." || true
              done
            fi
          done
