# Caller for the shared automation engine's @claude on-demand path
# (sakal-dev/automation). The engine owns the behaviour: mechanical
# claude-working claim/stand-down/release, ./tool/setup.sh, model-from-labels
# (opus/sonnet/fable), the verify-before-PR system prompt, per-issue
# concurrency. This file owns the triggers, the CHEAP OUTER GUARD (comment
# events fire on every comment — the `if:` below decides in ~1s, before the
# engine is even invoked), and the permissions. No placeholders.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# A reusable workflow cannot raise permissions beyond this grant — a missing
# line here fails inside the engine as a silent 403.
permissions:
  contents: write # branches + pushes
  pull-requests: write # open PRs
  issues: write # claude-working / claude-blocked labels
  id-token: write # claude-code-action OIDC
  actions: read # read CI results on PRs

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    uses: sakal-dev/automation/.github/workflows/on-demand.yml@v1
    secrets: inherit
