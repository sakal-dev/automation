name: "🧹 Chore"
description: "Maintenance with no behaviour change: deps, tooling, cleanup."
labels: ["type:chore", "claude-ready"]
body:
  - type: markdown
    attributes:
      value: |
        The heart of a chore is the **invariant**: what must be *identical* after.
        This is the type most tempting for agent overreach — Out of scope is the main field.
  - type: textarea
    id: what
    attributes:
      label: What changes
      description: The mechanical change itself.
      placeholder: "Bump drift 2.20 → 2.22; regenerate; fix any deprecations it flags"
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Invariant — what must NOT change
      description: The observable behaviour that must be identical afterwards.
      placeholder: "All user-visible behaviour. Schema unchanged. No new lint warnings."
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      placeholder: "- No 'while I'm here' refactors\n- No other dependency bumps"
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Pointers
      placeholder: "Changelog: https://… — note the breaking change in …"
  - type: markdown
    attributes:
      value: "**Done means:** `tool/verify.sh` green **and** the invariant held — no feature snuck in."
