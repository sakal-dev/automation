# Where this directory's data goes, and which layer it carries.
format_version: 1

# project = this .sakal/ owns the project layer (goals, personas, modules,
#           journeys, epics) — one repo is the project's home (the spec-home).
# app     = this .sakal/ carries only stories/ACs/tasks/bugs for one codebase
#           and REFERENCES the project layer that lives in the spec-home
#           repo's own .sakal/ tree, not on a server.
# A single-repo project uses `scope: project` and carries both layers here.
scope: project

project: <project key, matching the spec-home's own config.yaml>
app: <app key — REQUIRED when scope is app; the codebase this repo is>

# OPTIONAL, scope: app only. Path to the SPEC-HOME repo's own .sakal/
# directory, relative to this repo's root. Declaring it lets verify resolve
# what it otherwise cannot see from here: this tree's references to
# project-layer keys (epic, journey, persona, module) and its cross-repo
# citations, through the spec-home's registry/trees.yaml. Omit it and those
# stay unchecked, exactly as they were before 0.18.
# project_layer: ../<spec-home>/.sakal
