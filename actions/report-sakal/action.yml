# =============================================================================
# report-sakal — run lifecycle reporting into SakalMaster. v2: OIDC-FIRST.
# Same auth model as claim-sakal: in Actions the step mints a GitHub OIDC
# token (needs `permissions: id-token: write`) and the exchange returns the
# session + project — no stored secret, no project input. PAT fallback for
# non-Actions runners. Modes unchanged:
#   heartbeat | progress | succeeded | failed | blocked
# report_run/block_run only accept writes on a run THIS identity owns. Call
# the final outcome from an always() step — the integrated analogue of the
# label release. A `succeeded` run changes no AC: the verifier decides.
# v2 removes the deprecated sakal_url / anon_key names (last in v1.1.0).
# =============================================================================
name: report-sakal
description: "Report run lifecycle into SakalMaster agent_runs (OIDC by default; PAT fallback)"

inputs:
  mode:
    description: "heartbeat | progress | succeeded | failed | blocked"
    required: true
  run_id:
    description: The run to report on (from claim-sakal)
    required: true
  sakal_supabase_url:
    description: SakalMaster SUPABASE project URL (defaults to the hosted instance)
    required: false
    default: "https://yfsempkvvdglebtlkztn.supabase.co"
  sakal_supabase_publishable_key:
    description: Supabase publishable key (public; defaults to the hosted instance)
    required: false
    default: "sb_publishable_cxsc_iXaPmHoqAmwqgqURw_eHaO7Kaj"
  token:
    description: "PAT fallback for non-Actions runners. Leave empty in Actions."
    required: false
    default: ""
  project:
    description: "Project uuid — PAT path only (the OIDC exchange returns it)"
    required: false
    default: ""
  summary:
    description: Progress summary (mode=progress; optional elsewhere)
    required: false
    default: ""
  error:
    description: Error text (mode=failed)
    required: false
    default: ""
  pr_ref:
    description: "PR reference repo#number (mode=succeeded)"
    required: false
    default: ""
  reason:
    description: The question for the human (mode=blocked — REQUIRED there)
    required: false
    default: ""
  cost_usd:
    description: "MEASURED cost of the run so far (accumulates server-side). Leave EMPTY when the runtime cannot measure it — never report a number you cannot back."
    required: false
    default: ""
  lease_seconds:
    description: Lease extension on heartbeat/progress
    required: false
    default: "1800"

runs:
  using: composite
  steps:
    - name: Authenticate and report
      shell: bash
      env:
        SAKAL_SUPABASE_URL: ${{ inputs.sakal_supabase_url }}
        ANON: ${{ inputs.sakal_supabase_publishable_key }}
        PAT: ${{ inputs.token }}
        IN_PROJECT: ${{ inputs.project }}
        RUN: ${{ inputs.run_id }}
        MODE: ${{ inputs.mode }}
        SUMMARY: ${{ inputs.summary }}
        ERRTXT: ${{ inputs.error }}
        PR_REF: ${{ inputs.pr_ref }}
        REASON: ${{ inputs.reason }}
        COST: ${{ inputs.cost_usd }}
        LEASE: ${{ inputs.lease_seconds }}
        OIDC_AUDIENCE: sakalmaster
      run: |
        set -euo pipefail
        if [ -z "$PAT" ]; then
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::report-sakal: no PAT and no OIDC — grant id-token: write, or set token"; exit 1; }
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r '.value // empty')
          RESP=$(curl -sSf -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" -d "{\"oidc\":\"$OIDC\"}")
          JWT=$(jq -r '.access_token // empty' <<<"$RESP")
          PROJECT=$(jq -r '.project // empty' <<<"$RESP")
          [ -n "$JWT" ] && [ -n "$PROJECT" ] || { echo "::error::OIDC exchange failed"; exit 1; }
        else
          [ -n "$IN_PROJECT" ] || { echo "::error::PAT path requires the project input"; exit 1; }
          JWT=$(curl -sf -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" \
            -d "{\"token\":\"$PAT\"}" | jq -r '.access_token // empty')
          [ -n "$JWT" ] || { echo "::error::token-exchange failed"; exit 1; }
          PROJECT="$IN_PROJECT"
        fi
        H=(-H "apikey: $ANON" -H "authorization: Bearer $JWT" -H "content-type: application/json")
        RPC="$SAKAL_SUPABASE_URL/rest/v1/rpc"
        jstr() { jq -Rn --arg v "$1" '$v'; }
        # cost fragment, or nothing at all when unmeasured
        costf() { [ -n "${COST:-}" ] && printf ',"p_cost_usd":%s' "$COST" || true; }
        case "$MODE" in
          heartbeat)
            curl -sf -X POST "$RPC/report_run" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN\",\"p_status\":\"running\",\"p_lease_seconds\":$LEASE}" ;;
          progress)
            curl -sf -X POST "$RPC/report_run" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN\",\"p_status\":\"running\",\"p_summary\":$(jstr "$SUMMARY"),\"p_lease_seconds\":$LEASE}" ;;
          succeeded)
            curl -sf -X POST "$RPC/report_run" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN\",\"p_status\":\"succeeded\",\"p_pr_ref\":$(jstr "$PR_REF")$(costf)}" ;;
          failed)
            curl -sf -X POST "$RPC/report_run" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN\",\"p_status\":\"failed\",\"p_error\":$(jstr "$ERRTXT")$(costf)}" ;;
          blocked)
            [ -z "$REASON" ] && { echo "::error::mode=blocked requires a reason"; exit 1; }
            curl -sf -X POST "$RPC/block_run" "${H[@]}" \
              -d "{\"p_project\":\"$PROJECT\",\"p_run\":\"$RUN\",\"p_reason\":$(jstr "$REASON")}" ;;
          *)
            echo "::error::report-sakal: unknown mode '$MODE'"; exit 1 ;;
        esac
        echo "::notice::report-sakal: $MODE recorded for run $RUN"
