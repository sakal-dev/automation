# =============================================================================
# brief-sakal — the task brief, compiled server-side (with a loud fallback)
#
# MOVED, not rewritten (SKA-040). The engine carried two byte-identical copies
# of this logic in sweep.yml and on-demand.yml; three consecutive cuts
# (v2.8.0 copied it, v2.8.2 changed both, v2.9.0 changed both again) each paid
# double. The script below is the shipped v2.9.0 text, carved out and
# parameterised — behaviour identical by construction; the only deliberate
# additions are SKA-040 PART 2's two provenance fields.
# =============================================================================
name: brief-sakal
description: "Fetch the compiled brief (functions/v1/brief, mode=mechanical); fall back LOUDLY to raw REST assembly when the compiler is absent"

inputs:
  sakal_supabase_url:
    description: Resolved SakalMaster Supabase URL (from actions/resolve-env)
    required: true
  sakal_supabase_publishable_key:
    description: Resolved publishable key (public by design)
    required: true
  token:
    description: "PAT fallback (sakal_pat_...). Empty in Actions - OIDC is the default path."
    required: false
    default: ""
  project:
    description: Project uuid (from claim-sakal)
    required: true
  task:
    description: Task key
    required: true
  story:
    description: Story key (may be empty)
    required: false
    default: ""

outputs:
  brief:
    description: The brief text handed to the agent verbatim
    value: ${{ steps.fetch.outputs.brief }}

runs:
  using: composite
  steps:
    - name: Fetch brief
      id: fetch
      shell: bash
      env:
        SAKAL_SUPABASE_URL: ${{ inputs.sakal_supabase_url }}
        ANON: ${{ inputs.sakal_supabase_publishable_key }}
        PAT: ${{ inputs.token }}
        PROJECT: ${{ inputs.project }}
        TASK: ${{ inputs.task }}
        STORY: ${{ inputs.story }}
      run: |
        set -euo pipefail
        if [ -n "$PAT" ]; then BODY="{\"token\":\"$PAT\"}"; else
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sakalmaster" | jq -r .value)
          BODY="{\"oidc\":\"$OIDC\"}"; fi
        JWT=$(curl -sSf -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
          -H "apikey: $ANON" -H "content-type: application/json" -d "$BODY" | jq -r .access_token)
        H=(-H "apikey: $ANON" -H "authorization: Bearer $JWT")
        # ONE brief, compiled server-side (SKM-048). The hand-rolled
        # assembly below is now a FALLBACK for servers that predate the
        # function — loud, never fatal: a missing compiler must not stop a
        # dispatch, but it must never be silent either.
        # ── SKA-041: WHY the compiler said nothing ────────────────────────
        # v2.9.0/v2.10.0 collapsed every failure to `HTTP 000` and threw
        # curl's stderr away, so the one live run that fell back could not say
        # whether it timed out, failed DNS, or was refused — and the warning
        # GUESSED "may not be deployed", which probing later disproved (the
        # function answers 401 from outside; a missing one 404s). That is the
        # deaf-judge defect (F-16) in a quieter place: loud about the wrong
        # thing. The reason is now kept, timed, and named.
        BF=$(mktemp); BERR=$(mktemp)
        curl_reason() { # $1 = curl exit status → the failure in words
          case "$1" in
            0)  echo "no error" ;;
            6)  echo "could not resolve the host (DNS)" ;;
            7)  echo "could not connect (refused/unreachable)" ;;
            28) echo "TIMED OUT — the function did not answer in ${BRIEF_TIMEOUT}s (a cold edge start plus a full compile can exceed it)" ;;
            35|60) echo "TLS handshake or certificate failure" ;;
            52) echo "the server closed the connection with an empty reply" ;;
            56) echo "the connection broke mid-transfer" ;;
            *)  echo "curl error $1" ;;
          esac
        }
        brief_try() { # sets BCODE, BEXIT, BSECS, BMSG
          : > "$BF"; : > "$BERR"
          local w
          # curl times ITSELF (%{time_total}) — portable, and it measures the
          # call rather than the surrounding shell.
          w=$(curl -sS -o "$BF" -w '%{http_code} %{time_total}' --max-time "$BRIEF_TIMEOUT" \
            -X POST "$SAKAL_SUPABASE_URL/functions/v1/brief" \
            -H "apikey: $ANON" -H "authorization: Bearer $JWT" -H "content-type: application/json" \
            -d "{\"project\":\"$PROJECT\",\"task\":\"$TASK\",\"mode\":\"mechanical\"}" 2>"$BERR")
          BEXIT=$?
          BCODE=$(awk '{print $1}' <<<"$w"); BSECS=$(awk '{print $2}' <<<"$w")
          [ -n "$BCODE" ] || BCODE=000
          [ -n "$BSECS" ] || BSECS=0
          BMS=$(awk -v s="$BSECS" 'BEGIN{printf "%d", s*1000}')
          BMSG=$(tr -d '\r' < "$BERR" | tr '\n' ' ' | head -c 300)
        }
        BRIEF_TIMEOUT=60
        brief_try
        echo "::notice::brief call: HTTP $BCODE in ${BMS}ms (curl exit $BEXIT)"
        # ONE retry, and only when the first attempt produced NO HTTP answer.
        # A 4xx/5xx IS an answer — re-sending it unchanged is spam (SKA-038),
        # and a slow SUCCESS must never be doubled.
        if [ "$BCODE" = "000" ]; then
          echo "::warning::brief attempt 1 got no answer after ${BMS}ms — $(curl_reason "$BEXIT"). Retrying ONCE."
          brief_try
          echo "::notice::brief retry: HTTP $BCODE in ${BMS}ms (curl exit $BEXIT)"
        fi
        COMPILED=""
        case "$BCODE" in
          2*) COMPILED=$(jq -r '.brief // .markdown // .content // empty' "$BF" 2>/dev/null || true)
              [ -n "$COMPILED" ] || COMPILED=$(cat "$BF") ;;
        esac
        if [ -n "$COMPILED" ]; then
          { echo "brief<<SAKAL_BRIEF_EOF"; printf '%s\n' "$COMPILED"; echo "SAKAL_BRIEF_EOF"; } >> "$GITHUB_OUTPUT"
          echo "::notice::compiled brief fetched for $TASK (functions/v1/brief, mode=mechanical) in ${BMS}ms"
          exit 0
        fi
        # Say what is TRUE, not what is guessed.
        if [ "$BCODE" = "000" ]; then
          echo "::warning::the brief compiler did not answer after two attempts (${BMS}ms on the last) — $(curl_reason "$BEXIT"). The function IS deployed (it answers 401 to an unauthenticated probe; a missing one 404s), so this is a REACHABILITY or LATENCY problem, not a missing deployment."
        else
          BBODY=$(jq -r '.message // .error // empty' "$BF" 2>/dev/null || true)
          [ -n "$BBODY" ] || BBODY=$(head -c 300 "$BF")
          echo "::warning::the brief compiler ANSWERED and refused: HTTP $BCODE in ${BMS}ms — ${BBODY:-(empty body)}. That is a real answer, not a connection failure; 401/403 here means this runner's JWT is not accepted by the function, which is a different bug from a timeout."
        fi
        echo "::warning::FALLING BACK to the engine's own assembly from raw REST reads; the brief is thinner than the compiled one (no rules, no conventions, no repo profile)."
        STORY_JSON=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/stories?key=eq.$STORY&select=key,title,story,acs(id,key,text)" | jq '.[0] // {}')
        TASK_JSON=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/tasks?key=eq.$TASK&select=key,title,status,github" | jq '.[0] // {}')
        AC_STATUS=$(curl -sf "${H[@]}" "$SAKAL_SUPABASE_URL/rest/v1/v_ac_status?select=ac_id,status" | jq 'map({(.ac_id|tostring):.status}) | add // {}')
        {
          echo "brief<<SAKAL_BRIEF_EOF"
          echo "## Task $TASK: $(jq -r '.title // "?"' <<<"$TASK_JSON") (task status: $(jq -r '.status // "?"' <<<"$TASK_JSON"))"
          echo
          echo "## Story $STORY: $(jq -r '.title // "?"' <<<"$STORY_JSON")"
          jq -r '.story // empty' <<<"$STORY_JSON"
          echo
          echo "## Acceptance criteria (status is DERIVED — verify against code)"
          jq -r --argjson st "$AC_STATUS" '.acs[]? | "- [\($st[.id|tostring] // "unknown")] \(.key): \(.text)"' <<<"$STORY_JSON"
          echo "SAKAL_BRIEF_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::brief fetched for $TASK ($STORY)"
