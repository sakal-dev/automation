# =============================================================================
# claim-sakal — SOURCE step, sakalmaster (integrated) mode. v2: OIDC-FIRST.
#
# Default path (GitHub Actions, ZERO stored secrets): the job mints a GitHub
# OIDC token (requires `permissions: id-token: write` in the caller), the
# SakalMaster token-exchange verifies it against GitHub's JWKS and maps the
# GitHub-signed `repository` claim through apps.github_repo → project + app.
# The caller supplies NOTHING: no token, no project, no app — the granularity
# rule (contract invariant 4: a repo claims only its own app's tasks) is
# enforced by the server-side mapping, not by configuration. Audience is
# pinned to `sakalmaster` (replay defence).
#
# Fallback path (non-Actions runners — the VPS workers — which cannot mint
# OIDC): set `token` (a sakal_pat_… PAT) + `project` (+ `app` for the filter).
#
# URL + publishable key default to the hosted instance — they are public and
# identical for every caller; override only for self-hosted SakalMaster.
# The claim itself is unchanged: atomic, leased, FOR UPDATE SKIP LOCKED.
# v2 removes the deprecated sakal_url / anon_key input names (v1.1.0 was the
# last release accepting them).
# =============================================================================
name: claim-sakal
description: "Claim one task from the SakalMaster queue (OIDC by default — zero stored secrets; PAT fallback for non-Actions runners)"

inputs:
  sakal_supabase_url:
    description: SakalMaster SUPABASE project URL (defaults to PRODUCTION; override for self-hosted)
    required: false
    default: "https://gubehzbezjkkszhwjjnj.supabase.co"
  sakal_supabase_publishable_key:
    description: Supabase publishable key (public; defaults to PRODUCTION)
    required: false
    default: "sb_publishable_jQKMbs0FhRirLJ4t7Rrcag__iBdcD0G"
  token:
    description: "PAT fallback (sakal_pat_…) for runners that cannot mint GitHub OIDC. Leave empty in Actions."
    required: false
    default: ""
  project:
    description: "Project uuid — PAT path only (the OIDC exchange returns it)"
    required: false
    default: ""
  app:
    description: "App-filter key — PAT path only (the OIDC exchange returns the repo's mapped app)"
    required: false
    default: ""
  source:
    description: "What this run is DOING (asserted intent): github-sweep | github-mention | send-to-claude | manual. REQUIRED — no default, because a default silently lies for any caller it wasn't written for (session 12 audit). The runtime itself is DERIVED by SakalMaster from the credential into agent_runs.method; never restate it here."
    required: true
  task_key:
    description: "CLAIM BY NAME (SKA-037): a task key from a targeted dispatch. Set → start_task_run (this task or nothing); empty → claim_next_task (take the head of the queue). The two are one step because they share one auth path — a second copy of the OIDC exchange is a second place for it to rot."
    required: false
    default: ""
  on_refusal:
    description: "What a server REFUSAL means to the caller: 'fail' (a queue claim that errors is a broken runner) | 'stand-down' (a named dispatch the server declines — already leased, not ready, method excluded — is a CLEAN outcome: claimed=false, refusal quoted, exit 0)."
    required: false
    default: "fail"
  lease_seconds:
    description: Lease duration; heartbeats extend it
    required: false
    default: "1800"

outputs:
  claimed:
    description: "'true' if a task was claimed"
    value: ${{ steps.claim.outputs.claimed }}
  refusal:
    description: "The server's teaching refusal, VERBATIM, when a named claim stood down (empty otherwise). Quote it — do not paraphrase a refusal you did not write."
    value: ${{ steps.claim.outputs.refusal }}
  run_id:
    description: The agent_runs id owning the lease
    value: ${{ steps.claim.outputs.run_id }}
  task_key:
    description: Claimed task key
    value: ${{ steps.claim.outputs.task_key }}
  story_key:
    description: The story the task implements (may be empty)
    value: ${{ steps.claim.outputs.story_key }}
  project:
    description: Project uuid (from the OIDC exchange, or the input on the PAT path)
    value: ${{ steps.claim.outputs.project }}
  app:
    description: App key (from the OIDC exchange, or the input on the PAT path)
    value: ${{ steps.claim.outputs.app }}

runs:
  using: composite
  steps:
    - name: Authenticate and claim
      id: claim
      shell: bash
      env:
        SAKAL_SUPABASE_URL: ${{ inputs.sakal_supabase_url }}
        ANON: ${{ inputs.sakal_supabase_publishable_key }}
        PAT: ${{ inputs.token }}
        IN_PROJECT: ${{ inputs.project }}
        IN_APP: ${{ inputs.app }}
        SRC: ${{ inputs.source }}
        LEASE: ${{ inputs.lease_seconds }}
        TASK_KEY: ${{ inputs.task_key }}
        ON_REFUSAL: ${{ inputs.on_refusal }}
        OIDC_AUDIENCE: sakalmaster
      run: |
        set -euo pipefail
        if [ -z "$PAT" ]; then
          # ── OIDC path (default): zero stored secrets ──────────────────────
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::claim-sakal: no PAT given and no OIDC available — in Actions, grant 'permissions: id-token: write'; off Actions, set the token input"
            exit 1
          fi
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r '.value // empty')
          [ -n "$OIDC" ] || { echo "::error::could not mint an OIDC token"; exit 1; }
          RESP=$(curl -sSf -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" -d "{\"oidc\":\"$OIDC\"}")
          JWT=$(jq -r '.access_token // empty' <<<"$RESP")
          PROJECT=$(jq -r '.project // empty' <<<"$RESP")
          APP=$(jq -r '.app // empty' <<<"$RESP")
          [ -n "$JWT" ] && [ -n "$PROJECT" ] && [ -n "$APP" ] || {
            echo "::error::OIDC exchange failed or repo not linked to an app: $(jq -c 'del(.access_token)' <<<"$RESP" 2>/dev/null)"; exit 1; }
          echo "::notice::OIDC: $GITHUB_REPOSITORY → project=$PROJECT app=$APP (server-mapped, no stored secret)"
        else
          # ── PAT fallback (non-Actions runners) ────────────────────────────
          [ -n "$IN_PROJECT" ] || { echo "::error::PAT path requires the project input"; exit 1; }
          JWT=$(curl -sf -X POST "$SAKAL_SUPABASE_URL/functions/v1/token-exchange" \
            -H "apikey: $ANON" -H "content-type: application/json" \
            -d "{\"token\":\"$PAT\"}" | jq -r '.access_token // empty')
          [ -n "$JWT" ] || { echo "::error::token-exchange failed — check the PAT"; exit 1; }
          PROJECT="$IN_PROJECT"; APP="$IN_APP"
        fi
        # TWO CLAIMS, ONE AUTH PATH. Unnamed: take the head of the queue
        # (claim_next_task). NAMED (SKA-037 targeted dispatch): this task or
        # nothing (start_task_run) — the server decides whether the task is
        # claimable and its refusal is the teaching text we quote.
        if [ -n "$TASK_KEY" ]; then
          RPC_NAME="start_task_run"
          payload="{\"p_project\":\"$PROJECT\",\"p_task\":\"$TASK_KEY\",\"p_source\":\"$SRC\",\"p_lease_seconds\":$LEASE}"
        else
          RPC_NAME="claim_next_task"
          payload="{\"p_project\":\"$PROJECT\",\"p_source\":\"$SRC\",\"p_lease_seconds\":$LEASE"
          # The app filter is ALWAYS applied when an app is known (invariant 4);
          # on the OIDC path it always is — the mapping is the enforcement.
          if [ -n "$APP" ]; then payload="$payload,\"p_app\":\"$APP\""; fi
          payload="$payload}"
        fi
        # Status-aware: a method rejection is a 42501 with SakalMaster's own
        # operator message, which -sf would swallow. Capture body + code.
        BODY=$(mktemp)
        CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "$SAKAL_SUPABASE_URL/rest/v1/rpc/$RPC_NAME" \
          -H "apikey: $ANON" -H "authorization: Bearer $JWT" \
          -H "content-type: application/json" -d "$payload")
        if [ "$CODE" != "200" ]; then
          MSG=$(jq -r '.message // .hint // .' "$BODY" 2>/dev/null || cat "$BODY")
          # A NAMED claim the server declines is a clean outcome, not a red
          # run: already leased, not agent-ready, method excluded — each is
          # the server teaching us something in its own words. Quote it and
          # stand down. (PGRST202 = the RPC does not exist on this server yet:
          # forward-compatible with SKM-046 not being deployed.)
          if [ "$ON_REFUSAL" = "stand-down" ]; then
            case "$CODE" in
              404) MSG="${MSG} (start_task_run is not on this server yet — SKM-046 undeployed; the dispatch cannot be claimed by name here)" ;;
            esac
            {
              echo "claimed=false"
              echo "refusal<<SAKAL_REFUSAL_EOF"
              echo "$MSG"
              echo "SAKAL_REFUSAL_EOF"
            } >> "$GITHUB_OUTPUT"
            rm -f "$BODY"
            echo "::notice::STAND DOWN — the server declined this named claim (HTTP $CODE): $MSG"
            exit 0
          fi
          case "$MSG" in
            *"accepts work from"*)
              # POLICY STOP (session 12 STEP 3): the app does not accept work
              # from this runtime — and the runtime was PROVEN from the
              # credential, so this is real misconfiguration, not a blip.
              # Loud and terminal: no retry, no fallback to github mode.
              echo "::error::METHOD REJECTED — $MSG"
              echo "::error::Fix the app's allowed execution methods (App Management → this app), or run this task through an allowed method. This job will NOT retry or fall back."
              exit 1 ;;
            *) echo "::error::claim failed (HTTP $CODE): $MSG"; exit 1 ;;
          esac
        fi
        CLAIM=$(cat "$BODY"); rm -f "$BODY"
        {
          echo "project=$PROJECT"
          echo "app=$APP"
        } >> "$GITHUB_OUTPUT"
        RUN=$(jq -r 'if type == "array" then .[0].run_id else .run_id end // empty' <<<"$CLAIM")
        if [ -z "$RUN" ]; then
          echo "claimed=false" >> "$GITHUB_OUTPUT"
          # A NAMED claim that returns no row is the server saying "not this
          # one" without an error — still a stand-down, never a fallthrough
          # to some other task.
          if [ -n "$TASK_KEY" ]; then
            {
              echo "refusal<<SAKAL_REFUSAL_EOF"
              echo "start_task_run returned no run for task $TASK_KEY — the server did not grant this claim (already leased, retired, or not claimable)."
              echo "SAKAL_REFUSAL_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::STAND DOWN — no run granted for named task $TASK_KEY"
            exit 0
          fi
          # Paused and empty both return NO ROWS by design (a paused app must not
          # fail a cron red every ten minutes). They mean different things to an
          # operator, so name which one — one cheap read, on the cheap path.
          PAUSED=$(curl -sf "$SAKAL_SUPABASE_URL/rest/v1/v_app_execution?app_key=eq.$APP&select=app_paused,project_paused" \
            -H "apikey: $ANON" -H "authorization: Bearer $JWT" 2>/dev/null \
            | jq -r '.[0] | if .project_paused then "project" elif .app_paused then "app" else "" end' 2>/dev/null || true)
          if [ -n "$PAUSED" ]; then
            echo "::notice::PAUSED ($PAUSED) — SakalMaster is withholding work deliberately. Clean exit, no retry; unpause in App Management to resume."
          else
            echo "::notice::SakalMaster queue empty for app '$APP' — nothing to claim."
          fi
          exit 0
        fi
        # start_task_run may answer with an object, claim_next_task with a
        # one-row array — read both shapes rather than betting on one.
        pick() { jq -r "if type == \"array\" then .[0].$1 else .$1 end // empty" <<<"$CLAIM"; }
        {
          echo "claimed=true"
          echo "run_id=$RUN"
          echo "task_key=$(pick task_key)"
          echo "story_key=$(pick story_key)"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Claimed $(pick task_key) (run $RUN)"
