# =============================================================================
# claim-sakal — SOURCE step, sakalmaster (integrated) mode. REAL.
# Contract: docs/task-contract.md step 1. REST per SakalMaster's
# docs/ci/agent-runs.md: token-exchange (SAKAL_TOKEN → ~15-min JWT) →
# POST /rest/v1/rpc/claim_next_task. The claim is atomic and leased
# (FOR UPDATE SKIP LOCKED server-side): one winner even with parallel
# claimants; an expired lease makes the task claimable again and the old run
# `abandoned`. This action never retries a claim it lost.
#
# APP FILTER (contract invariant 4): the `app` input forwards as `p_app` ONLY
# when non-empty. As of 2026-07-22 SakalMaster's claim_next_task has NO app
# parameter — the formal request is filed (see the SakalMaster issue
# referenced in docs/methods/03). Until it lands: leave `app` empty ONLY for
# projects with a single app; a multi-app project MUST NOT run a filterless
# claim from a repo-bound claimant.
#
# Outputs: claimed=true|false; run_id, task_key, story_key when claimed.
# Empty queue → claimed=false, success exit (the caller's cheap gate).
# =============================================================================
name: claim-sakal
description: "Claim one task from the SakalMaster queue (token-exchange + PostgREST, atomic lease)"

inputs:
  # Naming (2026-07-23, aligned with SakalMaster's CLI): the Supabase project
  # origin — NOT the web-app origin — hence sakal_supabase_url. Old names
  # accepted through v1 with a deprecation warning; removed in v2.
  sakal_supabase_url:
    description: SakalMaster SUPABASE project URL (https://xyz.supabase.co — not the web app origin)
    required: false
    default: ""
  sakal_supabase_publishable_key:
    description: Supabase publishable key (public, sb_publishable_…)
    required: false
    default: ""
  sakal_url:
    description: "DEPRECATED alias of sakal_supabase_url (removed in v2)"
    required: false
    default: ""
  anon_key:
    description: "DEPRECATED alias of sakal_supabase_publishable_key (removed in v2)"
    required: false
    default: ""
  project:
    description: SakalMaster project id (uuid)
    required: true
  app:
    description: "App key/id for the claim filter (forwarded as p_app only when set — requires the SakalMaster app-filter change)"
    required: false
    default: ""
  source:
    description: Claim source recorded on the run
    required: false
    default: "github-sweep"
  lease_seconds:
    description: Lease duration; heartbeats extend it
    required: false
    default: "1800"
  token:
    description: SAKAL_TOKEN — service-account PAT (secret)
    required: true

outputs:
  claimed:
    description: "'true' if a task was claimed"
    value: ${{ steps.claim.outputs.claimed }}
  run_id:
    description: The agent_runs id owning the lease
    value: ${{ steps.claim.outputs.run_id }}
  task_key:
    description: Claimed task key (e.g. TSK-0012)
    value: ${{ steps.claim.outputs.task_key }}
  story_key:
    description: The story the task implements (may be empty)
    value: ${{ steps.claim.outputs.story_key }}

runs:
  using: composite
  steps:
    - name: Exchange token and claim
      id: claim
      shell: bash
      env:
        SAKAL_SUPABASE_URL: ${{ inputs.sakal_supabase_url }}
        SAKAL_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.sakal_supabase_publishable_key }}
        LEGACY_URL: ${{ inputs.sakal_url }}
        LEGACY_KEY: ${{ inputs.anon_key }}
        TOKEN: ${{ inputs.token }}
        PROJECT: ${{ inputs.project }}
        APP: ${{ inputs.app }}
        SRC: ${{ inputs.source }}
        LEASE: ${{ inputs.lease_seconds }}
      run: |
        set -euo pipefail
        SAKAL_URL="${SAKAL_SUPABASE_URL:-$LEGACY_URL}"
        ANON="${SAKAL_SUPABASE_PUBLISHABLE_KEY:-$LEGACY_KEY}"
        [ -z "$SAKAL_URL" ] && { echo "::error::claim-sakal needs sakal_supabase_url"; exit 1; }
        [ -n "$LEGACY_URL" ] && [ -z "$SAKAL_SUPABASE_URL" ] && echo "::warning::input 'sakal_url' is deprecated — use 'sakal_supabase_url' (removed in v2)"
        [ -n "$LEGACY_KEY" ] && [ -z "$SAKAL_SUPABASE_PUBLISHABLE_KEY" ] && echo "::warning::input 'anon_key' is deprecated — use 'sakal_supabase_publishable_key' (removed in v2)"
        JWT=$(curl -sf -X POST "$SAKAL_URL/functions/v1/token-exchange" \
          -H "apikey: $ANON" -H "content-type: application/json" \
          -d "{\"token\":\"$TOKEN\"}" | jq -r '.access_token // empty')
        if [ -z "$JWT" ]; then
          echo "::error::token-exchange failed — check SAKAL_URL / SAKAL_TOKEN / anon key"
          exit 1
        fi
        payload="{\"p_project\":\"$PROJECT\",\"p_source\":\"$SRC\",\"p_lease_seconds\":$LEASE"
        if [ -n "$APP" ]; then payload="$payload,\"p_app\":\"$APP\""; fi
        payload="$payload}"
        CLAIM=$(curl -sf -X POST "$SAKAL_URL/rest/v1/rpc/claim_next_task" \
          -H "apikey: $ANON" -H "authorization: Bearer $JWT" \
          -H "content-type: application/json" -d "$payload")
        RUN=$(echo "$CLAIM" | jq -r '.[0].run_id // empty')
        if [ -z "$RUN" ]; then
          echo "claimed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::SakalMaster queue empty for this project/app — nothing to claim."
          exit 0
        fi
        {
          echo "claimed=true"
          echo "run_id=$RUN"
          echo "task_key=$(echo "$CLAIM" | jq -r '.[0].task_key // empty')"
          echo "story_key=$(echo "$CLAIM" | jq -r '.[0].story_key // empty')"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Claimed $(echo "$CLAIM" | jq -r '.[0].task_key') (run $RUN)"
